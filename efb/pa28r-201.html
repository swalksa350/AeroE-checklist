<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARROW Checklist – AeroE</title>
<meta name="description" content="AeroE Checklist EFB edition: Piper PA-28R-201 Arrow III/IV normal, abnormal and emergency checklists in one offline file.">
<style>

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#12181d}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#12181d}
/* Layout: full-height two-pane app (list | procedure) that collapses to one pane on a phone.
   Dark-first: cockpit-style charcoal panels, cyan responses, amber/red for abnormal/emergency. */
:root{
  color-scheme: dark;
  --bg:#12181d; --panel:#1b2329; --panel-2:#222d35; --line:#2f3c46;
  --ink:#dfe5e9; --ink-dim:#8b9aa6; --ink-mute:#5c6b76;
  --amber:#e6ad3c; --red:#e0524a; --green:#5cc48d; --cyan:#5bb7d2;
  --done-ink:#56c88a; --tap:#2a3741;
  --on-green:#042a18; --on-amber:#1a1200; --on-red:#ffffff;
  --radius:6px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#eef1f3; --panel:#ffffff; --panel-2:#f3f6f8; --line:#d3dade;
    --ink:#131a1f; --ink-dim:#5a6873; --ink-mute:#8e9ba5;
    --amber:#b7780a; --red:#c2322a; --green:#1f8f55; --cyan:#1a7f9c;
    --done-ink:#1f8f55; --tap:#e4eaee;
    --on-green:#ffffff; --on-amber:#ffffff; --on-red:#ffffff;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef1f3; --panel:#ffffff; --panel-2:#f3f6f8; --line:#d3dade;
  --ink:#131a1f; --ink-dim:#5a6873; --ink-mute:#8e9ba5;
  --amber:#b7780a; --red:#c2322a; --green:#1f8f55; --cyan:#1a7f9c;
  --done-ink:#1f8f55; --tap:#e4eaee;
  --on-green:#ffffff; --on-amber:#ffffff; --on-red:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.3;-webkit-user-select:none;user-select:none;overflow:hidden}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header .brand{padding:12px 16px;font-weight:700;letter-spacing:.02em;display:flex;flex-direction:column;justify-content:center;min-width:120px}
header .brand small{font-weight:400;color:var(--ink-dim);font-size:12px}
nav.modes{display:flex;flex:1;min-width:0}
nav.modes button{flex:1;padding:14px 4px;font-size:14px;font-weight:600;color:var(--ink-dim);border-bottom:3px solid transparent;min-width:0;white-space:nowrap}
nav.modes button.norm{color:var(--green)}
nav.modes button.abn{color:var(--amber)}
nav.modes button.emerg{color:var(--red)}
nav.modes button:not(.on){opacity:.72}
nav.modes button.on{color:var(--ink);border-bottom-color:var(--cyan)}
nav.modes button.on.norm{color:var(--green);border-bottom-color:var(--green)}
nav.modes button.on.abn{color:var(--amber);border-bottom-color:var(--amber)}
nav.modes button.on.emerg{color:var(--red);border-bottom-color:var(--red)}
nav.modes button .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--amber);color:var(--on-amber);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}
header .theme{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink-dim);border-left:1px solid var(--line);font-size:11px;line-height:1}
header .theme .g{font-size:17px;line-height:1}
header .theme:active{background:var(--tap)}
header .theme.on{color:var(--ink)}
@media (max-width:480px){
  header .brand{min-width:0;padding:10px 12px}
  header .brand small{display:none}
  nav.modes button{font-size:13px;padding:14px 2px}
}
@media (max-width:400px){ nav.modes button{font-size:12px;letter-spacing:-.01em} }

main{flex:1;display:flex;min-height:0}
aside{width:300px;border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding-left:env(safe-area-inset-left,0px);-webkit-overflow-scrolling:touch}
section.view{flex:1;min-width:0;overflow:auto;padding:0 env(safe-area-inset-right,0px) 60px 0;-webkit-overflow-scrolling:touch}
@media (max-width:760px){
  aside{width:100%;border-right:0;padding-right:env(safe-area-inset-right,0px)}
  section.view{padding-left:env(safe-area-inset-left,0px)}
  main.showing-proc aside{display:none}
  main:not(.showing-proc):not(.picker) section.view{display:none}
}

.group-title{padding:14px 16px 6px;color:var(--ink-dim);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.list button{display:flex;width:100%;align-items:center;gap:10px;padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}
.list button:active{background:var(--tap)}
.list button.sel{background:var(--panel-2)}
.list .dot{width:10px;height:10px;border-radius:50%;background:var(--ink-mute);flex:none}
.list .dot.done{background:var(--green)}
.list .dot.partial{background:var(--amber)}
.list .dot.active{background:var(--red)}
.list .name{flex:1;min-width:0}
.list .n{color:var(--ink-mute);font-size:13px;font-variant-numeric:tabular-nums}

.proc-head{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.proc-head .back{display:none;padding:6px 10px 6px 0;color:var(--cyan);white-space:nowrap}
@media (max-width:760px){.proc-head .back{display:block}}
.proc-head h1{margin:0;font-size:20px;flex:1;min-width:0;font-weight:700;text-wrap:balance}
.proc-head h1.emerg{color:var(--red)}
.proc-head h1.abn{color:var(--amber)}
.proc-head h1.norm{color:var(--green)}
.proc-head .cond{display:block;font-size:13px;font-weight:400;color:var(--ink-dim);margin-top:2px}
.proc-head .tools{display:flex;gap:6px}
.tools button{padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;color:var(--ink-dim)}
.tools button:active{background:var(--tap)}

.items{padding:6px 0}
.item{display:flex;align-items:baseline;gap:10px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);position:relative}
.item:active{background:var(--tap)}
.item .chal{flex:0 1 auto;min-width:0}
.item .lead{flex:1;border-bottom:2px dotted var(--ink-mute);transform:translateY(-5px);min-width:16px}
.item .resp{flex:0 1 auto;min-width:0;text-align:right;font-weight:700;color:var(--cyan)}
.item.next{background:var(--panel-2)}
.item.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mode,var(--cyan))}
section.view.norm{--mode:var(--green)} section.view.abn{--mode:var(--amber)} section.view.emerg{--mode:var(--red)}
section.view.emerg .item .resp{color:var(--ink)}
.item.defer .chal,.item.defer .resp{color:var(--amber)}
.item.done.defer .chal,.item.done.defer .resp{color:var(--done-ink)}
.item.done{color:var(--ink-mute)}
.item.done .resp{color:var(--done-ink)}
.item.done .chal::before{content:"✓ ";color:var(--green)}
.item.done .lead{border-color:var(--line)}
.item.mem{border-left:4px solid var(--red)}
.item.mem.next::before{display:none}
.item.mem .chal::after{content:" (memory)";color:var(--red);font-size:12px;font-weight:600}
.item.note{color:var(--ink-dim);font-size:15px;display:block;padding:9px 16px 9px 24px;border-bottom:0;cursor:default}
.item.note.warn{color:var(--red)}
.item.note.caution{color:var(--amber)}
.item.sub{padding-left:40px}
.item.sub .chal::before{content:"– ";color:var(--ink-mute)}
.item.done.sub .chal::before{content:"✓ "}

.branch{padding:10px 16px;border-bottom:1px solid var(--line)}
.branch .q{color:var(--amber);font-weight:600;margin-bottom:8px}
.branch .opts{display:flex;gap:8px;flex-wrap:wrap}
.branch .opts button{padding:9px 14px;border:1px solid var(--amber);border-radius:var(--radius);color:var(--amber);font-weight:600}
.branch .opts button.sel{background:var(--amber);color:var(--on-amber)}
.branch .opts button.off{opacity:.35}

.complete{margin:16px;padding:14px 16px;border-radius:var(--radius);background:var(--green);color:var(--on-green);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.complete button{padding:8px 14px;border-radius:var(--radius);background:var(--on-green);color:var(--green);font-size:14px}
.land{margin:12px 16px 0;padding:10px 14px;border-radius:var(--radius);background:var(--red);color:var(--on-red);font-weight:700;text-align:center}
.land.amber{background:var(--amber);color:var(--on-amber)}

.status{padding:0 16px 16px}
.status .proc-head{margin:0 -16px 8px}
.status h2{font-size:13px;color:var(--ink-dim);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.status .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.status .row>*{min-width:0}
.status .row.red{color:var(--red)}
.status .row.amb{color:var(--amber)}
.status .row button{text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line)}
.status .ok{color:var(--green)}
.status .pend{color:var(--amber)}
.status .empty{color:var(--ink-mute);padding:8px 0}
.status .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.deferred li{padding:6px 0;border-bottom:1px solid var(--line)}
.deferred ul{list-style:none;padding:0;margin:0}
.confirm{margin-top:10px;padding:12px 14px;border:1px solid var(--red);border-radius:var(--radius);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm span{flex:1;min-width:160px}
.confirm button{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line);font-size:14px}
.confirm button.danger{background:var(--red);color:var(--on-red);border-color:var(--red)}
.link{color:var(--cyan)}
.saved{font-size:12px;color:var(--ink-mute);margin-top:8px}

.upd{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;width:100%;padding:12px 16px;background:var(--cyan);color:#06202a;font-weight:700;font-size:15px;text-align:center;border-bottom:1px solid var(--line)}
.upd.ready{background:var(--amber);color:var(--on-amber)}
.upd.info{background:var(--green);color:var(--on-green)}
#updstate.ready{color:var(--amber);font-weight:700}
.upd .x{padding:6px 12px;border:1px solid currentColor;border-radius:var(--radius);font-size:13px;font-weight:600}
.favp{margin:12px 16px 0;padding:12px 14px;border:1px solid var(--amber);border-radius:var(--radius);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel)}
.favp span{flex:1;min-width:180px}
.favp button{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line);font-size:14px}
.favp button.add{background:var(--amber);color:var(--on-amber);border-color:var(--amber);font-weight:700}
footer{font-size:11px;color:var(--ink-mute);text-align:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel)}
@media (prefers-reduced-motion:no-preference){.item{transition:background .12s}}

/* ---- aircraft picker and header additions ---- */
header .brand{cursor:pointer;gap:2px}
header .brand .ac{display:flex;align-items:center;gap:6px}
header .brand .ac .chev{font-size:11px;color:var(--ink-dim)}
header .brand:active{background:var(--tap)}
header.picker-head nav.modes{display:none}
header.picker-head .brand{flex:1;cursor:default}
header .brand .title{font-weight:700}
main.picker aside{display:none}
main.picker section.view{display:block}
.picker{padding:0 16px 40px}
.picker .intro{color:var(--ink-dim);font-size:14px;padding:14px 0 4px;max-width:60ch}
.picker .continue{margin:12px 0 4px;padding:12px 14px;border-radius:var(--radius);background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.picker .continue .lbl{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.picker .continue .nm{font-weight:700}
.picker .continue .go{margin-left:auto;color:var(--cyan);font-weight:600;white-space:nowrap}
.picker h2{font-size:13px;color:var(--ink-dim);margin:22px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;padding:12px 44px 12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);text-align:left;min-width:0;position:relative;cursor:pointer}
.card .star{position:absolute;right:4px;top:4px;width:38px;height:38px;font-size:22px;line-height:1;color:var(--ink-mute);border-radius:var(--radius)}
.card .star.on{color:var(--amber)}
.card .star:active{background:var(--tap)}
.card:active{background:var(--tap)}
.card .mk{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.card .md{font-weight:700;font-size:17px}
.card .en{font-size:13px;color:var(--ink-dim)}
.card .pr{font-size:12px;color:var(--ink-mute);margin-top:4px;font-variant-numeric:tabular-nums}
.card .pr.go{color:var(--green)}
.card .pr.em{color:var(--red);font-weight:600}
.card .short{position:absolute;right:44px;top:10px;font-size:11px;color:var(--ink-mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.vs{padding:4px 16px 16px}
.vs .meta{color:var(--ink-dim);font-size:14px;padding:10px 0 4px}
.vs table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.vs td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.vs td:first-child{color:var(--ink-dim);width:38%;padding-right:12px}
.vs td:last-child{font-weight:600;color:var(--cyan)}
.list button.ref .dot{background:transparent;border:1px solid var(--ink-mute)}
.status .acline{color:var(--ink-dim);font-size:14px;margin-top:-2px}

/* EFB edition: single aircraft, header brand is not a button */
header .brand{cursor:default}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand" id="brand"></div>
    <nav class="modes" id="modes" aria-label="Checklist sections"></nav>
    <button class="theme" id="theme" aria-label="Day or night display"></button>
  </header>
  <main id="main">
    <aside id="side"></aside>
    <section class="view" id="view"></section>
  </main>
  <footer>Prototype content. Verify against the operator's approved checklist and the POH/AFM before any use. · AeroE Checklist EFB edition cb0c6525</footer>
</div>
<script>

      {c:"Mixture", r:"IDLE CUT-OFF"},
      {c:"Throttle", r:"OPEN 1/2 inch"},
      {c:"Propeller area", r:"CLEAR"},
      {c:"Starter", r:"ENGAGE (10 s max, then 30 s cool-down)"},

<script>
/* AeroE Checklist – EFB edition engine.
   A trimmed copy of the main app's checklist logic for a single aircraft in one self-contained file:
   no aircraft picker, no service worker, no update checks, no favourites. Saved ticks use browser
   storage when the host viewer allows it and the page works normally when it does not. */
const a = window.AIRCRAFT[0];
const MODES = [["normal","Normal"],["abnormal","Abnormal"],["emergency","Emergency"],["status","Status"]];
const STORE_KEY = "aeroe-efb-" + a.id;
const state = {mode:"normal", sel:null, showing:false, ticks:{}, branches:{}, confirmReset:false};
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s&&typeof s==="object"){ if(s.ticks)state.ticks=s.ticks; if(s.branches)state.branches=s.branches; if(MODES.some(m=>m[0]===s.mode))state.mode=s.mode; if(typeof s.sel==="string"||s.sel===null)state.sel=s.sel; state.showing=!!s.showing; } }catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({ticks:state.ticks,branches:state.branches,mode:state.mode,sel:state.sel,showing:state.showing})); }catch(e){} }

/* day / night */
const THEME_KEY="aeroe-efb-theme", THEMES=[["auto","Auto","◐"],["day","Day","☀"],["night","Night","☾"]];
let theme="auto"; try{ const t=localStorage.getItem(THEME_KEY); if(THEMES.some(x=>x[0]===t)) theme=t; }catch(e){}
function applyTheme(){ const r=document.documentElement; if(theme==="night")r.setAttribute("data-theme","dark"); else if(theme==="day")r.setAttribute("data-theme","light"); else r.removeAttribute("data-theme"); try{localStorage.setItem(THEME_KEY,theme);}catch(e){} }

function proc(mode,id){return (a[mode]||[]).find(p=>p.id===id)}
function key(pid,path){return pid+"/"+path}
function rows(p){
  const out=[];
  const walk=(items,prefix)=>items.forEach((it,i)=>{
    const path=prefix+i;
    if(it.branch){const chosen=state.branches[key(p.id,path)];out.push({type:"branch",it,path,chosen});if(chosen&&it.opts[chosen])walk(it.opts[chosen],path+"."+chosen+".");}
    else if(it.note)out.push({type:"note",it,path});
    else if(it.defer)out.push({type:"defer",it,path});
    else out.push({type:"item",it,path});
  });
  walk(p.items,"");return out;
}
const actionable=r=>r.type==="item"||r.type==="defer";
const isDone=(p,r)=>!!state.ticks[key(p.id,r.path)];
function progress(p){const all=rows(p),rs=all.filter(actionable),d=rs.filter(r=>isDone(p,r)).length,open=all.some(r=>r.type==="branch"&&!r.chosen);return{done:d,total:rs.length,complete:rs.length>0&&d===rs.length&&!open}}
function resetProc(p){Object.keys(state.ticks).forEach(k=>{if(k.startsWith(p.id+"/"))delete state.ticks[k]});Object.keys(state.branches).forEach(k=>{if(k.startsWith(p.id+"/"))delete state.branches[k]})}
const activeNonNormal=()=>["emergency","abnormal"].flatMap(m=>a[m].map(p=>({m,p}))).filter(x=>{const pr=progress(x.p);return pr.done>0&&!pr.complete});
function deferredItems(){const out=[];["emergency","abnormal"].forEach(m=>a[m].forEach(p=>rows(p).forEach(r=>{if(r.type==="defer"&&isDone(p,r))out.push(r.it.defer)})));return out}

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e}
function go(fn){fn();save();render()}

function render(){
  const brand=$("#brand");brand.innerHTML="";brand.append(h("span",{class:"ac"},h("span",{},a.short)),h("small",{},a.maker+" "+a.model));
  const nav=$("#modes");nav.innerHTML="";const act=activeNonNormal().length;
  MODES.forEach(([m,label])=>{const b=h("button",{class:(state.mode===m?"on ":"")+(m==="emergency"?"emerg":m==="abnormal"?"abn":m==="normal"?"norm":""),onclick:()=>go(()=>{state.mode=m;state.sel=null;state.showing=false;state.confirmReset=false})},label);if(m==="status"&&act)b.append(h("span",{class:"badge"},act));nav.append(b)});
  const tb=$("#theme");tb.innerHTML="";const t=THEMES.find(x=>x[0]===theme);tb.className="theme"+(theme!=="auto"?" on":"");tb.append(h("span",{class:"g"},t[2]),h("span",{},t[1]));tb.onclick=()=>{const i=THEMES.findIndex(x=>x[0]===theme);theme=THEMES[(i+1)%THEMES.length][0];applyTheme();render()};
  $("#main").classList.toggle("showing-proc",state.showing);
  const view=$("#view");view.classList.remove("norm","abn","emerg");if(state.mode!=="status")view.classList.add(state.mode==="normal"?"norm":state.mode==="abnormal"?"abn":"emerg");
  renderSide();renderView();
}
function renderSide(){
  const s=$("#side");s.innerHTML="";
  if(state.mode==="status"){s.append(h("div",{class:"group-title"},"Status"));s.append(h("div",{class:"list"},h("button",{class:"sel",onclick:()=>go(()=>{state.showing=true})},h("span",{class:"name"},"Flight status overview"))));return}
  const list=h("div",{class:"list"});
  s.append(h("div",{class:"group-title"},state.mode==="normal"?"Normal checklists":state.mode==="emergency"?"Emergency procedures":"Abnormal procedures"));
