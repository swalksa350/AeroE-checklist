html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#12181d}
/* Layout: full-height two-pane app (list | procedure) that collapses to one pane on a phone.
   Dark-first: cockpit-style charcoal panels, cyan responses, amber/red for abnormal/emergency. */
:root{
  color-scheme: dark;
  --bg:#12181d; --panel:#1b2329; --panel-2:#222d35; --line:#2f3c46;
  --ink:#dfe5e9; --ink-dim:#8b9aa6; --ink-mute:#5c6b76;
  --amber:#e6ad3c; --red:#e0524a; --green:#5cc48d; --cyan:#5bb7d2;
  --done-ink:#56c88a; --tap:#2a3741;
  --on-green:#042a18; --on-amber:#1a1200; --on-red:#ffffff;
  --radius:6px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#eef1f3; --panel:#ffffff; --panel-2:#f3f6f8; --line:#d3dade;
    --ink:#131a1f; --ink-dim:#5a6873; --ink-mute:#8e9ba5;
    --amber:#b7780a; --red:#c2322a; --green:#1f8f55; --cyan:#1a7f9c;
    --done-ink:#1f8f55; --tap:#e4eaee;
    --on-green:#ffffff; --on-amber:#ffffff; --on-red:#ffffff;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef1f3; --panel:#ffffff; --panel-2:#f3f6f8; --line:#d3dade;
  --ink:#131a1f; --ink-dim:#5a6873; --ink-mute:#8e9ba5;
  --amber:#b7780a; --red:#c2322a; --green:#1f8f55; --cyan:#1a7f9c;
  --done-ink:#1f8f55; --tap:#e4eaee;
  --on-green:#ffffff; --on-amber:#ffffff; --on-red:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.3;-webkit-user-select:none;user-select:none;overflow:hidden}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header .brand{padding:12px 16px;font-weight:700;letter-spacing:.02em;display:flex;flex-direction:column;justify-content:center;min-width:120px}
header .brand small{font-weight:400;color:var(--ink-dim);font-size:12px}
nav.modes{display:flex;flex:1;min-width:0}
nav.modes button{flex:1;padding:14px 4px;font-size:14px;font-weight:600;color:var(--ink-dim);border-bottom:3px solid transparent;min-width:0;white-space:nowrap}
nav.modes button.norm{color:var(--green)}
nav.modes button.abn{color:var(--amber)}
nav.modes button.emerg{color:var(--red)}
nav.modes button:not(.on){opacity:.72}
nav.modes button.on{color:var(--ink);border-bottom-color:var(--cyan)}
nav.modes button.on.norm{color:var(--green);border-bottom-color:var(--green)}
nav.modes button.on.abn{color:var(--amber);border-bottom-color:var(--amber)}
nav.modes button.on.emerg{color:var(--red);border-bottom-color:var(--red)}
nav.modes button .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--amber);color:var(--on-amber);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}
/* Mac and iPad (iPadOS 26+) installs draw the window's close / minimise / zoom controls over the top-left corner */
html.win-controls header{padding-left:calc(env(safe-area-inset-left,0px) + 96px)}
html.win-controls header .brand{min-width:0}

}

@media (max-width:640px){ nav.modes button .full{display:none} nav.modes button .short{display:inline} nav.modes button{font-size:13px;padding:14px 2px} header .brand{min-width:0;padding:10px 12px} header .theme span:not(.g){display:none} header .theme{width:40px} }
@media (max-width:430px){ nav.modes button{font-size:12px} }

@media (max-width:760px){ html.win-controls nav.modes button .full{display:none} html.win-controls nav.modes button .short{display:inline} html.win-controls header .brand{min-width:0;padding:10px 10px} html.win-controls header .brand small{display:none} html.win-controls header .theme span:not(.g){display:none} html.win-controls header .theme{width:40px} }

.charts .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.charts .row a{color:var(--cyan);text-decoration:none;font-weight:600}

.charts input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);color:var(--ink);width:7ch;text-transform:uppercase}

main{flex:1;display:flex;min-height:0}

}

.group-title{padding:14px 16px 6px;color:var(--ink-dim);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.list button{display:flex;width:100%;align-items:center;gap:10px;padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}
.list button:active{background:var(--tap)}

.list .dot.done{background:var(--green)}
.list .dot.partial{background:var(--amber)}
.list .dot.active{background:var(--red)}
.list .name{flex:1;min-width:0}
.list .n{color:var(--ink-mute);font-size:13px;font-variant-numeric:tabular-nums}

.proc-head{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.proc-head .back{display:none;padding:6px 10px 6px 0;color:var(--cyan);white-space:nowrap}
@media (max-width:760px){.proc-head .back{display:block}}
.proc-head h1{margin:0;font-size:20px;flex:1;min-width:0;font-weight:700;text-wrap:balance}
.proc-head h1.emerg{color:var(--red)}
.proc-head h1.abn{color:var(--amber)}
.proc-head h1.norm{color:var(--green)}

.tools button{padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;color:var(--ink-dim)}
.tools button:active{background:var(--tap)}

.items{padding:6px 0}
.item{display:flex;align-items:baseline;gap:10px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);position:relative}
.item:active{background:var(--tap)}
.item .chal{flex:0 1 auto;min-width:0}
.item .lead{flex:1;border-bottom:2px dotted var(--ink-mute);transform:translateY(-5px);min-width:16px}
.item .resp{flex:0 1 auto;min-width:0;text-align:right;font-weight:700;color:var(--cyan)}
.item.next{background:var(--panel-2)}
.item.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mode,var(--cyan))}
section.view.norm{--mode:var(--green)} section.view.abn{--mode:var(--amber)} section.view.emerg{--mode:var(--red)}
section.view.emerg .item .resp{color:var(--ink)}
.item.defer .chal,.item.defer .resp{color:var(--amber)}
.item.done.defer .chal,.item.done.defer .resp{color:var(--done-ink)}
.item.done{color:var(--ink-mute)}
.item.done .resp{color:var(--done-ink)}
.item.done .chal::before{content:"✓ ";color:var(--green)}
.item.done .lead{border-color:var(--line)}
.item.mem{border-left:4px solid var(--red)}
.item.mem.next::before{display:none}
.item.mem .chal::after{content:" (memory)";color:var(--red);font-size:12px;font-weight:600}
.item.note{color:var(--ink-dim);font-size:15px;display:block;padding:9px 16px 9px 24px;border-bottom:0;cursor:default}
.item.note.warn{color:var(--red)}
.item.note.caution{color:var(--amber)}
.item.sub{padding-left:40px}
.item.sub .chal::before{content:"– ";color:var(--ink-mute)}
.item.done.sub .chal::before{content:"✓ "}

.branch{padding:10px 16px;border-bottom:1px solid var(--line)}
.branch .q{color:var(--amber);font-weight:600;margin-bottom:8px}
.branch .opts{display:flex;gap:8px;flex-wrap:wrap}
.branch .opts button{padding:9px 14px;border:1px solid var(--amber);border-radius:var(--radius);color:var(--amber);font-weight:600}
.branch .opts button.sel{background:var(--amber);color:var(--on-amber)}
.branch .opts button.off{opacity:.35}

.complete{margin:16px;padding:14px 16px;border-radius:var(--radius);background:var(--green);color:var(--on-green);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.complete button{padding:8px 14px;border-radius:var(--radius);background:var(--on-green);color:var(--green);font-size:14px}
.land{margin:12px 16px 0;padding:10px 14px;border-radius:var(--radius);background:var(--red);color:var(--on-red);font-weight:700;text-align:center}
.land.amber{background:var(--amber);color:var(--on-amber)}

.status{padding:0 16px 16px}
.status .proc-head{margin:0 -16px 8px}
.status h2{font-size:13px;color:var(--ink-dim);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.status .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.status .row>*{min-width:0}
.status .row.red{color:var(--red)}
.status .row.amb{color:var(--amber)}
.status .row button{text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line)}
.status .ok{color:var(--green)}
.status .pend{color:var(--amber)}
.status .empty{color:var(--ink-mute);padding:8px 0}
.status .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.deferred li{padding:6px 0;border-bottom:1px solid var(--line)}
.deferred ul{list-style:none;padding:0;margin:0}
.confirm{margin-top:10px;padding:12px 14px;border:1px solid var(--red);border-radius:var(--radius);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm span{flex:1;min-width:160px}
.confirm button{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line);font-size:14px}
.confirm button.danger{background:var(--red);color:var(--on-red);border-color:var(--red)}
.link{color:var(--cyan)}
/* voice bar */
.vbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:2px solid var(--cyan);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.vbar .st{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;grid-column:1/-1;display:flex;gap:8px;align-items:center}
.vbar .st .lis{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.vbar .st .lis{animation:pulse 1s infinite alternate}}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.vbar .cur{font-size:16px;min-width:0}
.vbar .cur b{color:var(--cyan)}
.vbar .heard{font-size:13px;color:var(--ink-dim);grid-column:1/-1}
.vbar .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.vbar button{padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-weight:600;color:var(--ink)}
.vbar button.ok{background:var(--green);color:var(--on-green);border-color:var(--green);font-size:16px;padding:12px 22px}
.vbar button.stop{color:var(--red);border-color:var(--red)}
.vbar button:active{background:var(--tap)}
main.voice-on section.view{padding-bottom:150px}
@media (max-width:480px){.vbar{grid-template-columns:1fr}.vbar .btns{justify-content:stretch}.vbar .btns button{flex:1}}
.group-title{display:flex;align-items:center;gap:8px}
.group-title .mic{margin-left:auto;padding:4px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:12px;color:var(--cyan);text-transform:none;letter-spacing:0;font-weight:600}
.group-title .mic.on{border-color:var(--red);color:var(--red)}
.status .tog{padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-weight:600;color:var(--ink-dim)}
.status .tog.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.status .seg{display:flex;gap:4px} .status .seg button{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;color:var(--ink-dim)} .status .seg button.on{color:var(--ink);border-color:var(--cyan)}
.wakedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.wakedot{animation:pulse 1.2s infinite alternate}}

.editor input{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);color:var(--ink);min-width:0;width:100%}
.editor .ops{display:flex;gap:4px} .editor .ops button{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px}
.editor .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .editor .actions button{padding:9px 14px;border:1px solid var(--line);border-radius:var(--radius);font-weight:600}
.editor .actions button.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.editor .hint{font-size:13px;color:var(--ink-dim);margin:6px 0 10px}
@media (max-width:480px){.editor .line{grid-template-columns:1fr auto}.editor .line input:nth-child(2){grid-column:1}}
.status select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);color:var(--ink);max-width:55%}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;padding:12px 44px 12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);text-align:left;min-width:0;position:relative;cursor:pointer}
.card .star{position:absolute;right:4px;top:4px;width:38px;height:38px;font-size:22px;line-height:1;color:var(--ink-mute);border-radius:var(--radius)}
.card .star.on{color:var(--amber)}
.card .star:active{background:var(--tap)}
.card:active{background:var(--tap)}
.card .mk{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.card .md{font-weight:700;font-size:17px}
.card .en{font-size:13px;color:var(--ink-dim)}
.card .pr{font-size:12px;color:var(--ink-mute);margin-top:4px;font-variant-numeric:tabular-nums}
.card .pr.go{color:var(--green)}
.card .pr.em{color:var(--red);font-weight:600}
.card .short{position:absolute;right:44px;top:10px;font-size:11px;color:var(--ink-mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.vs{padding:4px 16px 16px}
.vs .meta{color:var(--ink-dim);font-size:14px;padding:10px 0 4px}
.vs table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.vs td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.vs td:first-child{color:var(--ink-dim);width:38%;padding-right:12px}
.vs td:last-child{font-weight:600;color:var(--cyan)}
.list button.ref .dot{background:transparent;border:1px solid var(--ink-mute)}
.status .acline{color:var(--ink-dim);font-size:14px;margin-top:-2px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <button class="brand" id="brand" aria-label="Choose aircraft"></button>
    <nav class="modes" id="modes" aria-label="Checklist sections"></nav>
    <button class="theme" id="theme" aria-label="Day or night display"></button>
  </header>
  <main id="main">
    <aside id="side"></aside>
    <section class="view" id="view"></section>
  </main>
  <footer id="foot">Prototype content. Verify against the operator's approved checklist and the POH/AFM before any use.</footer>
</div>

<script>
/* ---------------- DATA ----------------
   Aircraft are loaded from aircraft/<id>.js, each pushing one object onto window.AIRCRAFT:
   {id, maker, model, short, category, engine, seats, basis, vspeeds:[{k,v}], normal:[], emergency:[], abnormal:[]}
   Procedure: {id, name, cond?, land?, items}
   Item types:
   {c:"Challenge", r:"RESPONSE"}            normal line
   {c:..., r:..., mem:true}                  memory item
   {c:..., r:..., sub:true}                  indented sub-line
   {note:"text", kind:"warn"|"caution"}      non-actionable text
   {branch:"question", opts:{"A":[items], "B":[items]}}   conditional
   {defer:"text"}                            item that rolls to the Status page
----------------------------------------*/
const CATEGORIES = ["Single-engine piston","High-performance single","Multi-engine piston","Turboprop"];
const AIRCRAFT = (window.AIRCRAFT || []).slice().sort((a,b)=>CATEGORIES.indexOf(a.category)-CATEGORIES.indexOf(b.category) || (a.maker+a.model).localeCompare(b.maker+b.model));
const byId = id => AIRCRAFT.find(a=>a.id===id) || null;

/* ---------------- STATE + PERSISTENCE ---------------- */
const STORE_KEY = "ga-ecl-v2";
const LEGACY_KEY = "c208b-ecl-v1";
const BUILD = "4c661567";
let CHANGES = [];   // loaded from changes.json; newest first
const APP_VERSION = () => CHANGES.length ? CHANGES[0].version : "";
const state = {ac:null, lastAc:null, mode:"normal", sel:null, showing:false, per:{}, fav:[], uses:{}, favAsked:{}, favPromptHidden:false, confirmReset:false, savedAt:null, custom:{}, sharedApproach:{on:false, name:"", items:[]}};
const MODES = [["normal","Normal","Normal"],["abnormal","Abnormal","Abnorm"],["emergency","Emergency","Emerg"],["charts","Charts","Charts"],["status","Status","Status"]];
const AC = () => byId(state.ac);
const PER = () => { if(!state.per[state.ac]) state.per[state.ac] = {ticks:{}, branches:{}}; return state.per[state.ac]; };
const CUSTOM_ID="approach-custom";
const CUSTOM_TEMPLATE=[{c:"ATIS / AWIS",r:"OBTAINED"},{c:"Altimeter",r:"SET"},{c:"Approach",r:"BRIEFED (type, minima, missed approach)"},{c:"Navigation / avionics",r:"SET for approach"},{c:"Fuel",r:"CHECK quantity & selector"},{c:"Mixture",r:"SET / RICH"},{c:"Fuel pump",r:"ON (if applicable)"},{c:"Lights",r:"ON"},{c:"Seat belts / harnesses",r:"SECURE"},{c:"Passengers",r:"BRIEFED"},{c:"Speed",r:"SET for approach"}];
function customFor(aid){
  let c=state.custom&&state.custom[aid]; if(!c) return {approach:null,overrides:{}};
  if(Array.isArray(c.items)){ c={approach:{name:c.name,items:c.items},overrides:{}}; state.custom[aid]=c; }   // older shape
  if(!c.overrides) c.overrides={};
  return c;
}
function sharedApproachActive(aid){ return state.sharedApproach.on && isFav(aid) && state.sharedApproach.items.length>0; }
function customApproach(aid){
  if(sharedApproachActive(aid)) return {name:state.sharedApproach.name||"Approach (shared)",items:state.sharedApproach.items,shared:true};
  const c=customFor(aid).approach; return c&&Array.isArray(c.items)&&c.items.length ? c : null;
}
function withCustom(a){
  const cf=customFor(a.id);
  const out=a.normal.map(p=>{ const o=cf.overrides[p.id]; return (o&&Array.isArray(o.items)&&o.items.length) ? Object.assign({},p,{items:o.items,edited:true}) : p; });
  const c=customApproach(a.id);
  if(c){ const proc={id:CUSTOM_ID,name:c.name||"Approach (custom)",items:c.items.map(it=>Object.assign({},it)),custom:true,edited:true}; let i=out.findIndex(p=>p.id==="land"); if(i<0) i=out.length; out.splice(i,0,proc); }
  return out;
}
function editedCount(aid){ const cf=customFor(aid); return Object.keys(cf.overrides).length+(customApproach(aid)?1:0); }
const DATA = () => { const a=AC(); return a ? {normal:withCustom(a), emergency:a.emergency, abnormal:a.abnormal} : {normal:[],emergency:[],abnormal:[]}; };

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && typeof s==="object"){
        if(s.per && typeof s.per==="object") state.per = s.per;
        if(typeof s.ac==="string" && byId(s.ac)) state.ac = s.ac;
        if(typeof s.lastAc==="string" && byId(s.lastAc)) state.lastAc = s.lastAc;
        if(Array.isArray(s.fav)) state.fav = s.fav.filter(id=>byId(id));
        if(s.uses && typeof s.uses==="object") state.uses = s.uses;
        if(s.favAsked && typeof s.favAsked==="object") state.favAsked = s.favAsked;
        if(s.custom && typeof s.custom==="object") state.custom = s.custom;
        if(s.sharedApproach && typeof s.sharedApproach==="object") state.sharedApproach = {on:!!s.sharedApproach.on, name:String(s.sharedApproach.name||""), items:Array.isArray(s.sharedApproach.items)?s.sharedApproach.items:[]};
        if(MODES.some(([m])=>m===s.mode)) state.mode = s.mode;
        if(typeof s.sel==="string"||s.sel===null) state.sel = s.sel;
        state.showing = !!s.showing;
        state.savedAt = s.savedAt||null;
      }
    }else{
      // carry over progress from the single-aircraft C208B version
      const old = localStorage.getItem(LEGACY_KEY);
      if(old){
        const s = JSON.parse(old);
        if(s && s.ticks) state.per.c208b = {ticks:s.ticks||{}, branches:s.branches||{}};
      }
    }
  }catch(e){ /* storage unavailable: run without it */ }
}
function save(){
  state.savedAt = Date.now();
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({per:state.per, ac:state.ac, lastAc:state.lastAc, fav:state.fav, uses:state.uses, favAsked:state.favAsked, custom:state.custom, sharedApproach:state.sharedApproach, mode:state.mode, sel:state.sel, showing:state.showing, savedAt:state.savedAt}));
  }catch(e){ /* ignore */ }
}

/* Day / night display: "auto" follows the phone, "day" and "night" force it. Remembered per device. */
const THEME_KEY = "ga-ecl-theme";
const THEMES = [["auto","Auto","◐"],["day","Day","☀"],["night","Night","☾"]];
let theme = "auto";
try{ const t=localStorage.getItem(THEME_KEY); if(THEMES.some(x=>x[0]===t)) theme=t; }catch(e){}
function applyTheme(){
  const root=document.documentElement;
  if(theme==="night") root.setAttribute("data-theme","dark");
  else if(theme==="day") root.setAttribute("data-theme","light");
  else root.removeAttribute("data-theme");
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  const dark = theme==="night" || (theme==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  let m=document.querySelector('meta[name="theme-color"]:not([media])');
  if(!m){ m=document.createElement("meta"); m.name="theme-color"; document.head.prepend(m); }
  m.content = dark ? "#1b2329" : "#ffffff";
}
function cycleTheme(){ const i=THEMES.findIndex(x=>x[0]===theme); theme=THEMES[(i+1)%THEMES.length][0]; applyTheme(); render(); }
function renderThemeButton(){
  const b=$("#theme"); b.innerHTML="";
  const t=THEMES.find(x=>x[0]===theme);
  b.className="theme"+(theme!=="auto"?" on":"");
  b.title="Display: "+t[1]+" (tap to change)";
  b.append(h("span",{class:"g"},t[2]),h("span",{},t[1]));
  b.onclick=cycleTheme;
}

/* Keep the screen awake while a checklist is open (silently skipped where not allowed). */
let wakeLock = null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator) || wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") keepAwake(); });

function proc(mode,id){return (DATA()[mode]||[]).find(p=>p.id===id)}
function key(pid,path){return pid+"/"+path}

/* Flatten a procedure into visible rows given current branch selections */
function rows(p){
  const out=[]; const per=PER();
  const walk=(items,prefix)=>items.forEach((it,i)=>{
    const path=prefix+i;
    if(it.branch){
      const chosen=per.branches[key(p.id,path)];
      out.push({type:"branch",it,path,chosen});
      if(chosen && it.opts[chosen]) walk(it.opts[chosen],path+"."+chosen+".");
    }else if(it.note){out.push({type:"note",it,path})}
    else if(it.defer){out.push({type:"defer",it,path})}
    else out.push({type:"item",it,path});
  });
  walk(p.items,"");
  return out;
}
function actionable(r){return r.type==="item"||r.type==="defer"}
function isDone(p,r){return !!PER().ticks[key(p.id,r.path)]}
function progress(p){
  const all=rows(p);
  const rs=all.filter(actionable);
  const d=rs.filter(r=>isDone(p,r)).length;
  const open=all.some(r=>r.type==="branch"&&!r.chosen);
  return {done:d,total:rs.length,complete:rs.length>0&&d===rs.length&&!open};
}
function resetProc(p){
  const per=PER();
  Object.keys(per.ticks).forEach(k=>{if(k.startsWith(p.id+"/"))delete per.ticks[k]});
  Object.keys(per.branches).forEach(k=>{if(k.startsWith(p.id+"/"))delete per.branches[k]});
}
function withAircraft(aid, fn){ const prev=state.ac; state.ac=aid; try{ return fn(); } finally { state.ac=prev; } }
function activeNonNormal(aid){
  return withAircraft(aid||state.ac, ()=>["emergency","abnormal"].flatMap(m=>DATA()[m].map(p=>({m,p}))).filter(x=>{const pr=progress(x.p);return pr.done>0&&!pr.complete}));
}
function deferredItems(){
  const out=[];
  ["emergency","abnormal"].forEach(m=>DATA()[m].forEach(p=>rows(p).forEach(r=>{if(r.type==="defer"&&isDone(p,r))out.push({p,text:r.it.defer})})));
  return out;
}
function aircraftSummary(a){
  return withAircraft(a.id, ()=>{
    const act=activeNonNormal(a.id).length;
    const norm=withCustom(a).map(progress);
    const started=norm.filter(p=>p.done>0).length, complete=norm.filter(p=>p.complete).length;
    return {act, started, complete, total:withCustom(a).length};
  });
}

/* ---------------- RENDER ---------------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e}

function go(fn){ fn(); save(); render(); }
const FAV_PROMPT_AT = 3;          // opens before the app suggests adding an aircraft to favourites
const FAV_PROMPT_AGAIN = 10;      // further opens before asking again after "Not now"
function isFav(id){ return state.fav.includes(id); }
function toggleFav(id){ if(isFav(id)) state.fav = state.fav.filter(x=>x!==id); else state.fav.push(id); state.favAsked[id] = -1; }
function favPromptDue(){
  const id=state.ac; if(!id || isFav(id) || state.favPromptHidden) return false;
  const n=state.uses[id]||0, asked=state.favAsked[id];
  if(asked===-1) return false;                     // pilot set it explicitly (added or removed) – never nag
  if(asked===undefined) return n>=FAV_PROMPT_AT;
  return n>=asked+FAV_PROMPT_AGAIN;
}
function selectAircraft(id){
  state.ac=id; state.lastAc=id; state.uses[id]=(state.uses[id]||0)+1; state.favPromptHidden=false; state.mode="normal"; state.sel=null; state.showing=false; state.confirmReset=false;
  if(location.hash!=="#"+id){ try{ history.replaceState(null,"","#"+id); }catch(e){} }
}
function showPicker(){
  state.ac=null; state.showing=false; state.confirmReset=false;
  if(location.hash){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
}

function render(){
  const a=AC();
  const hdr=$("#hdr"); hdr.classList.toggle("picker-head",!a);
  const brand=$("#brand"); brand.innerHTML="";
  if(a){
    brand.append(h("span",{class:"ac"},h("span",{},a.short),h("span",{class:"chev"},"▼")),h("small",{},a.maker+" "+a.model));
    brand.onclick=()=>go(showPicker);
  }else{
    brand.append(h("span",{class:"title"},"AeroE Checklist"),h("small",{},AIRCRAFT.length+" aircraft · tap one to begin"));
    brand.onclick=null;
  }
  const nav=$("#modes");nav.innerHTML="";
  if(a){
    const act=activeNonNormal().length;
    MODES.forEach(([m,label,short])=>{
      const b=h("button",{class:(state.mode===m?"on ":"")+(m==="emergency"?"emerg":m==="abnormal"?"abn":m==="normal"?"norm":""),"aria-pressed":state.mode===m?"true":"false","aria-label":label,onclick:()=>go(()=>{state.mode=m;state.sel=null;state.showing=false;state.confirmReset=false})},h("span",{class:"full"},label),h("span",{class:"short"},short));
      if(m==="status"&&act)b.append(h("span",{class:"badge"},act));
      nav.append(b);
    });
  }
  renderThemeButton();
  $("#main").classList.toggle("showing-proc",!!a&&state.showing);
  $("#main").classList.toggle("picker",!a);
  const view=$("#view"); view.classList.remove("norm","abn","emerg"); if(a&&state.mode!=="status"&&state.mode!=="charts") view.classList.add(state.mode==="normal"?"norm":state.mode==="abnormal"?"abn":"emerg");
  if(!a){ $("#side").innerHTML=""; renderPicker($("#view")); renderVoiceBar(); return; }
  renderSide();renderView();renderVoiceBar();renderWakeDot();
}

function renderPicker(v){
  v.innerHTML="";
  const w=h("div",{class:"picker"});
  w.append(h("div",{class:"intro"},"Choose the aircraft you are flying. Each type has its own normal, abnormal and emergency checklists, and progress is kept separately per type on this device."));
  // last used
  let last=byId(state.lastAc);
  if(!last){ const l=Object.keys(state.per).filter(id=>byId(id)); if(l.length===1) last=byId(l[0]); }
  if(last) w.append(h("button",{class:"continue",onclick:()=>go(()=>selectAircraft(last.id))},h("span",{},h("div",{class:"lbl"},"Continue"),h("div",{class:"nm"},last.maker+" "+last.model)),h("span",{class:"go"},"Open ›")));
  const card=a=>{
    const s=aircraftSummary(a);
    let pr="", cls="pr";
    if(s.act){pr=s.act+" procedure"+(s.act>1?"s":"")+" in progress";cls+=" em"}
    else if(s.complete===s.total){pr="All normal checklists complete";cls+=" go"}
    else if(s.started){pr=s.complete+"/"+s.total+" normal checklists complete"}
    else pr="Not started";
    const fav=isFav(a.id);
    const star=h("button",{class:"star"+(fav?" on":""),"aria-label":(fav?"Remove ":"Add ")+a.short+(fav?" from favourites":" to favourites"),"aria-pressed":fav?"true":"false",
      onclick:ev=>{ev.stopPropagation();go(()=>toggleFav(a.id))}},fav?"★":"☆");
    return h("div",{class:"card",role:"button",tabindex:"0",onclick:()=>go(()=>selectAircraft(a.id)),onkeydown:ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go(()=>selectAircraft(a.id))}}},
      star,h("span",{class:"short"},a.short),h("span",{class:"mk"},a.maker),h("span",{class:"md"},a.model),h("span",{class:"en"},a.engine),h("span",{class:cls},pr));
  };
  const favs=state.fav.map(byId).filter(Boolean);
  if(favs.length){
    w.append(h("h2",{},"Favourites"));
    const grid=h("div",{class:"cards"}); favs.forEach(a=>grid.append(card(a))); w.append(grid);
  }else{
    w.append(h("div",{class:"intro"},"Tap the ☆ on an aircraft to keep it at the top of this list."));
  }
  CATEGORIES.forEach(cat=>{
    const list=AIRCRAFT.filter(a=>a.category===cat);
    if(!list.length) return;
    w.append(h("h2",{},cat));
    const grid=h("div",{class:"cards"});
    list.forEach(a=>grid.append(card(a)));
    w.append(grid);
  });
  w.append(h("a",{class:"efblink",href:"guide.html"},"User guide ›",h("small",{},"How installing, checklists, emergency procedures, the Status page, day and night display, updates and EFB files work.")));
  w.append(h("a",{class:"efblink",href:"efb/",target:"_blank",rel:"noopener"},"EFB files for OzRunways and AvPlan ›",h("small",{},"A single-file checklist and a printable PDF for every aircraft, with loading instructions. Also under each aircraft's Status page.")));
  v.append(w);
}

function favPrompt(){
  const a=AC(); if(!favPromptDue()) return null;
  return h("div",{class:"favp"},
    h("span",{},"You have opened the "+a.short+" "+(state.uses[a.id]||0)+" times. Add it to your favourites?"),
    h("button",{class:"add",onclick:()=>go(()=>{toggleFav(a.id)})},"Add ★"),
    h("button",{onclick:()=>go(()=>{state.favAsked[a.id]=state.uses[a.id]||0;state.favPromptHidden=true})},"Not now"));
}
function renderSide(){
  const s=$("#side");s.innerHTML="";
  const fp=favPrompt(); if(fp) s.append(fp);
  if(state.mode==="status"){s.append(h("div",{class:"group-title"},"Status"));s.append(h("div",{class:"list"},h("button",{class:"sel",onclick:()=>go(()=>{state.showing=true})},h("span",{class:"name"},"Flight status overview"))));return}
  if(state.mode==="charts"){s.append(h("div",{class:"group-title"},"Charts"));s.append(h("div",{class:"list"},h("button",{class:"sel",onclick:()=>go(()=>{state.showing=true})},h("span",{class:"name"},"Charts and documents"))));return}
  const list=h("div",{class:"list"});
  const gt=h("div",{class:"group-title"},state.mode==="normal"?"Normal checklists":state.mode==="emergency"?"Emergency procedures":"Abnormal procedures");
  if(voice.reply&&SR) gt.append(h("button",{class:"mic"+(recallState.on?" on":""),title:"Say a procedure name",onclick:voiceRecall},recallState.on?"● Listening":"🎤 Say procedure"));
  s.append(gt);
  if(recallState.msg) s.append(h("div",{class:"saved",style:"padding:0 16px 8px"},recallState.msg));
  if(state.mode==="normal"){
    list.append(h("button",{class:"ref "+(state.sel==="__vs"?"sel":""),onclick:()=>go(()=>{state.sel="__vs";state.showing=true})},h("span",{class:"dot"}),h("span",{class:"name"},"V-speeds & limits"),h("span",{class:"n"},"ref")));
  }
  DATA()[state.mode].forEach(p=>{
    const pr=progress(p);
    const dot=pr.complete?"done":pr.done>0?(state.mode==="normal"?"partial":"active"):"";
    list.append(h("button",{class:state.sel===p.id?"sel":"",onclick:()=>go(()=>{state.sel=p.id;state.showing=true})},
      h("span",{class:"dot "+dot}),h("span",{class:"name"},p.name+(p.edited?" ✎":"")),h("span",{class:"n"},pr.total?pr.done+"/"+pr.total:"")));
  });
  s.append(list);
}

function renderVspeeds(v){
  const a=AC();
  v.append(h("div",{class:"proc-head"},h("button",{class:"back",onclick:()=>go(()=>{state.showing=false})},"‹ Back"),h("h1",{},"V-speeds & limits",h("span",{class:"cond"},a.maker+" "+a.model))));
  const w=h("div",{class:"vs"});

/* Update awareness.
   - A bar appears while the app is open if a new build has been downloaded (tap to refresh).
   - On reopening after an update was applied, a one-time "updated" bar says so.
   - The Status page shows the version, the last check time and a manual check button. */
const UPD_KEY = "ga-ecl-build";
let updInfo = {lastCheck:null, waiting:false};
function updateState(){
  if(updInfo.waiting) return "New version ready – refresh";
  return updInfo.lastCheck ? "Up to date · checked "+new Date(updInfo.lastCheck).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Not checked yet";
}
function refreshUpdState(){ const el=document.getElementById("updstate"); if(el){ el.textContent=updateState(); el.classList.toggle("ready",updInfo.waiting); } }
function showBar(id, text, cls, actions){
  if(document.getElementById(id)) return null;
  const bar=document.createElement("div"); bar.id=id; bar.className="upd "+(cls||"");
  const txt=document.createElement("span"); txt.className="t"; txt.textContent=text; bar.append(txt);
  actions.forEach(action=>{ const b=document.createElement("button"); b.className="x"; b.textContent=action.label; b.onclick=()=>{ action.run(bar); }; bar.append(b); });
  document.getElementById("app").insertBefore(bar, document.getElementById("main"));
  return bar;
}

  const bar=showBar("upd","A new version is ready.","ready",[

/* ---------------- VOICE ----------------
   Opt-in. "Read aloud" speaks each line and waits for a tap (or a spoken reply) before the next.
   "Voice replies" listens for checked / set / repeat / skip / stop after each line, and powers the
   tap-then-speak procedure recall button. Everything here degrades to the normal tap behaviour. */
const VOICE_KEY="ga-ecl-voice";
const RATES=[[0.7,"Slow"],[0.8,"Slower"],[0.9,"Normal"],[1,"Brisk"],[1.15,"Fast"]];
const voice={read:false, reply:false, rate:0.9, voiceURI:"", brief:true, tones:true, early:true, wake:false};
try{ const v=JSON.parse(localStorage.getItem(VOICE_KEY)||"null"); if(v&&typeof v==="object"){ voice.read=!!v.read; voice.reply=!!v.reply; if(RATES.some(x=>x[0]===v.rate)) voice.rate=v.rate; else if(v.rate===1.2) voice.rate=1.15; if(typeof v.voiceURI==="string") voice.voiceURI=v.voiceURI; if(typeof v.brief==="boolean") voice.brief=v.brief; if(typeof v.tones==="boolean") voice.tones=v.tones; if(typeof v.early==="boolean") voice.early=v.early; if(typeof v.wake==="boolean") voice.wake=v.wake; } }catch(e){}
function saveVoice(){ try{ localStorage.setItem(VOICE_KEY, JSON.stringify(voice)); }catch(e){} }
const TTS = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
const vlog=[]; function vlogAdd(m){ const d=new Date(); vlog.push(d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})+" "+m); if(vlog.length>14) vlog.shift(); const el=document.getElementById("vlog"); if(el){ el.textContent=vlog.join("\n"); } }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
/* On Apple devices speech output and speech recognition share one audio channel and cannot overlap,
   so listening must stop before speaking and the early-microphone mode is unavailable. */
const APPLE = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) || /Mac|iP/.test(navigator.platform||"");
const earlyActive = () => voice.early && !APPLE;
let voicesCache=[]; function loadVoices(){ try{ voicesCache=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }catch(e){} }
if(TTS){ loadVoices(); try{ speechSynthesis.onvoiceschanged=()=>{ loadVoices(); }; }catch(e){} }
function pickVoice(){ if(!voicesCache.length) loadVoices(); return voicesCache.find(v=>v.voiceURI===voice.voiceURI) || voicesCache.find(v=>/en-AU/i.test(v.lang)) || voicesCache.find(v=>v.default) || voicesCache[0] || null; }
function sayable(t){
  return String(t)
    .replace(/\bKIAS\b/g,"knots").replace(/\bKTS?\b/g,"knots").replace(/\bRPM\b/g,"R P M").replace(/\bITT\b/g,"I T T").replace(/\bTIT\b/g,"T I T")
    .replace(/\bEGT\b/g,"E G T").replace(/\bCHT\b/g,"C H T").replace(/\bNg\b/g,"N G").replace(/\bNp\b/g,"N P").replace(/\bN1\b/g,"N 1")
    .replace(/°C/g," degrees C").replace(/°F/g," degrees F").replace(/°/g," degrees").replace(/\bpsi\b/g,"P S I").replace(/\bin Hg\b/g,"inches")
    .replace(/\bGPH\b/g,"gallons per hour").replace(/\bft\b/g,"feet").replace(/\bAGL\b/g,"A G L").replace(/\bMSL\b/g,"M S L").replace(/\bMP\b/g,"manifold pressure")
    .replace(/\bPFD\b/g,"P F D").replace(/\bMFD\b/g,"M F D").replace(/\bECU\b/g,"E C U").replace(/\bCBs\b/g,"circuit breakers").replace(/\bCB\b/g,"circuit breaker")
    .replace(/\bVmca?\b/g,"V M C").replace(/\bVyse\b/g,"V Y S E").replace(/\bVxse\b/g,"V X S E").replace(/\bVref\b/g,"V ref").replace(/\bVfe\b/g,"V F E").replace(/\bVle\b/g,"V L E").replace(/\bVlo\b/g,"V L O")
    .replace(/&/g," and ").replace(/[–—]/g,", ").replace(/\s*\/\s*/g,", ").replace(/\(([^)]*)\)/g,", $1,").replace(/\s+,/g,",").replace(/,\s*,/g,",");
}
/* Short form of a response for normal checklists: drop bracketed detail and read only the
   capitalised action, e.g. "CHECK visually (53 gal usable)" -> "CHECK", "RESET then ON" -> "RESET then ON".
   Falls back to the full response (minus brackets) when there is no capitalised action word. */
const CONNECT=new Set(["&","/","and","or","then","to","-","–","—","+"]);

  let t=String(r).replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();

  const isCaps=w=>/^[A-Z][A-Z&'’\/\-]+[.,;:]?$/.test(w)&&/[A-Z]{2}/.test(w);
  const isNum=w=>/^[\d.,%°]+[A-Za-z%°]*[.,;:]?$/.test(w);
  if(!toks.some(isCaps)) return t;
  const out=[];

    const bare=w.replace(/[.,;:]+$/,"");
    if(isCaps(w)||isNum(w)||CONNECT.has(bare.toLowerCase())){ out.push(bare); if(/[;:]$/.test(w)) break; }
    else break;

function responseForSpeech(r){ return (voice.brief&&state.mode==="normal") ? briefResponse(r) : r; }
let utterSeq=0;
function speak(text, onend){
  if(!TTS){ onend&&onend(); return; }
  if(vs.listening||(typeof wake!=="undefined"&&wake.on)){ stopListening(); if(typeof wake!=="undefined") wake.on=false; }
  const wait = APPLE ? Math.max(0, 300-(Date.now()-lastListenStop)) : 0;   // let the audio channel switch from recording to playback
  if(wait>0){ const id0=++utterSeq; setTimeout(()=>{ if(id0===utterSeq){ utterSeq--; speak(text,onend); } }, wait); return; }

  try{ speechSynthesis.resume(); }catch(e){}

  const fin=()=>{ if(done||id!==utterSeq) return; done=true; clearTimeout(t); clearTimeout(wd); onend&&onend(); };
  vlogAdd("speak: "+text.slice(0,40)+(speechSynthesis.speaking?" (engine busy)":"")+(speechSynthesis.paused?" (engine paused)":""));
  const make=()=>{ const u=new SpeechSynthesisUtterance(text); u.rate=voice.rate; const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } u.onstart=()=>{ started=true; vlogAdd("speech started"); }; u.onend=()=>{ vlogAdd("speech ended"); fin(); }; u.onerror=e=>{ vlogAdd("speech error: "+((e&&e.error)||"?")); if(e&&e.error==="interrupted"&&id!==utterSeq) return; fin(); }; return u; };

  const wd=setTimeout(()=>{                                      // watchdog: nothing started within 1.2 s – try once more
    if(done||started||id!==utterSeq) return;
    vlogAdd("speech did not start – retrying once");
    try{ speechSynthesis.cancel(); speechSynthesis.resume(); speechSynthesis.speak(make()); }catch(e){ vlogAdd("retry threw: "+e); }
  }, 1200);
  try{ speechSynthesis.speak(make()); }catch(e){ vlogAdd("speak threw: "+e); fin(); }

function stopSpeaking(){ utterSeq++; try{ speechSynthesis.cancel(); }catch(e){} }
let ttsPrimed=false, primePending=false;
function primeTTS(){
  if(ttsPrimed||!TTS) return;
  if(vs.listening||(typeof wake!=="undefined"&&wake.on)){ stopListening(); if(typeof wake!=="undefined") wake.on=false; }
  const since=Date.now()-lastListenStop;
  if(APPLE && since<320){ primePending=true; setTimeout(()=>{ primePending=false; primeTTS(); }, 320-since); return; }   // short timers keep the tap's permission in WebKit
  primePending=false;
  try{ speechSynthesis.resume(); const u=new SpeechSynthesisUtterance("ready"); u.volume=0; u.rate=1.5; u.onstart=()=>{ ttsPrimed=true; vlogAdd("primed (silent utterance played)"); }; u.onerror=e=>vlogAdd("prime error: "+((e&&e.error)||"?")); speechSynthesis.speak(u); vlogAdd("prime requested"); }catch(e){ vlogAdd("prime threw: "+e); }
  unlockAudio();
}
document.addEventListener("pointerdown", ()=>{ if(!ttsPrimed&&TTS&&(vs.listening||(typeof wake!=="undefined"&&wake.on))){ stopListening(); if(typeof wake!=="undefined") wake.on=false; } }, {capture:true});
document.addEventListener("pointerup", primeTTS, {capture:true});
document.addEventListener("click", primeTTS, {capture:true});
document.addEventListener("keydown", primeTTS, {capture:true});

/* --- cue tones (short beeps in the headset: one when listening starts, two when a word is accepted) --- */
let actx=null;
function unlockAudio(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(freq,ms,times){
  if(!voice.tones) return;
  try{
    unlockAudio(); if(!actx) return;
    let t=actx.currentTime+0.01;
    for(let i=0;i<(times||1);i++){
      const o=actx.createOscillator(), g=actx.createGain();

      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+ms/1000+0.02); t+=ms/1000+0.07;
    }
  }catch(e){}
}

/* --- read-aloud session for the open procedure --- */
const vs={active:false, pid:null, pending:null, readNotes:{}, skipped:{}, status:"", heard:"", listening:false, rec:null, retries:0};
function currentRows(){ const p=proc(state.mode,state.sel); return p?{p,rs:rows(p)}:null; }
function voiceStart(announce){ const c=currentRows(); if(!c||!voice.read){ vlogAdd("voiceStart skipped: "+(!c?"no checklist open":"read aloud off")); return; } vlogAdd("reading "+c.p.name); unlockAudio(); vs.active=true; vs.pid=c.p.id; vs.pending=null; vs.retries=0; vs.heard=""; vs.status="Reading"; renderVoiceBar(); if(announce){ const nm=c.p.name; speak(sayable(nm)+(/checklist|procedure/i.test(nm)?".":" checklist."), voiceNext); } else voiceNext(); }

  for(const r of rs){
    const k=key(p.id,r.path);
    if(r.type==="note"){ if(vs.readNotes[k]) continue; vs.readNotes[k]=1; vs.pending=null; vs.status="Reading"; renderVoiceBar(); speak(sayable(r.it.note), voiceNext); return; }
    if(r.type==="branch"){ if(r.chosen) continue; vs.pending=r; vs.retries=0; vs.status="Choose an option"; renderVoiceBar();
      vs.gate=Infinity;
      speak(sayable(r.it.branch)+". Options: "+Object.keys(r.it.opts).map(sayable).join(", or ")+".", ()=>{ vs.gate=Date.now()+120; if(voice.reply&&SR&&earlyActive()) beep(880,70,1); if(!(earlyActive()&&voice.reply&&SR&&vs.listening)) listenFor(r); });
      if(earlyActive()&&voice.reply&&SR) listenFor(r,true);
      return; }
    if(actionable(r)){ if(isDone(p,r)||vs.skipped[k]) continue; vs.pending=r; vs.retries=0; vs.status="Reading"; renderVoiceBar();
      const text=r.type==="defer"?("Deferred: "+sayable(r.it.defer)+". Noted."):(sayable(r.it.c)+", . "+sayable(responseForSpeech(r.it.r))+".");
      vs.gate=Infinity;
      speak(text, ()=>{ vs.gate=Date.now()+120; vs.status=voice.reply&&SR?"Listening":"Waiting for Checked"; if(voice.reply&&SR&&earlyActive()) beep(880,70,1); renderVoiceBar(); if(!(earlyActive()&&voice.reply&&SR&&vs.listening)) listenFor(r); });
      if(earlyActive()&&voice.reply&&SR) listenFor(r,true);
      return; }
  }
  const pr=progress(p);
  vs.pending=null; vs.active=false; vs.status=pr.complete?"Complete":"Nothing left to read";
  renderVoiceBar();
  speak(pr.complete?(sayable(p.name)+" checklist complete."):("End of "+sayable(p.name)+". Some items were skipped."));
}
function voiceConfirm(){ const r=vs.pending; if(!r||r.type==="branch") return; const c=currentRows(); if(!c) return; stopListening(); PER().ticks[key(c.p.id,r.path)]=1; vs.pending=null; voiceNext(); save(); render(); }
function voiceSkip(){ const r=vs.pending; if(!r) return; const c=currentRows(); if(!c) return; stopListening(); vs.skipped[key(c.p.id,r.path)]=1; vs.pending=null; voiceNext(); }
function voiceRepeat(){ const r=vs.pending; if(!r){ voiceNext(); return; } stopListening(); const c=currentRows(); if(!c) return;
  vs.gate=Infinity;
  const after=()=>{ vs.gate=Date.now()+120; if(voice.reply&&SR&&earlyActive()) beep(880,70,1); if(!(earlyActive()&&voice.reply&&SR&&vs.listening)) listenFor(r); };
  if(r.type==="branch") speak(sayable(r.it.branch)+". Options: "+Object.keys(r.it.opts).map(sayable).join(", or ")+".", after);
  else speak(r.type==="defer"?("Deferred: "+sayable(r.it.defer)):(sayable(r.it.c)+", . "+sayable(responseForSpeech(r.it.r))+"."), after);
  if(earlyActive()&&voice.reply&&SR) listenFor(r,true); }
function voiceChoose(r,o){ const c=currentRows(); if(!c) return; stopListening(); const per=PER(); per.branches[key(c.p.id,r.path)]=o; vs.pending=null; voiceNext(); save(); render(); }

/* --- speech recognition --- */
let lastListenStop=0;
function stopListening(){ if(vs.rec){ try{ vs.rec.onend=null; vs.rec.abort(); }catch(e){} vs.rec=null; lastListenStop=Date.now(); } vs.listening=false; }
function listenOnce(onAlts, onFail, onInterim, gate){
  if(!SR) { onFail&&onFail("unsupported"); return; }
  stopListening();
  let r; try{ r=new SR(); }catch(e){ onFail&&onFail("unsupported"); return; }
  r.lang=navigator.language||"en-AU"; r.interimResults=!!onInterim; r.maxAlternatives=4; r.continuous=!!onInterim;
  let got=false; const snap={};
  r.onstart=()=>{ vs.listening=true; if(!earlyActive() && vs.active && vs.pending) beep(880,70,1); renderVoiceBar(); };
  r.onaudiostart=()=>{ renderVoiceBar(); };
  r.onresult=e=>{
    const alts=[]; let anyFinal=false; const open = !gate || Date.now()>=gate();
    for(let i=0;i<e.results.length;i++){
      const res=e.results[i]; if(res.isFinal===true) anyFinal=true;
      const first=String(res[0]&&res[0].transcript||"").toLowerCase().trim();
      if(!open){ snap[i]=first; continue; }                         // still speaking: remember what the app's own voice produced
      const pre=snap[i]||"";
      for(let j=0;j<res.length;j++){
        let t=String(res[j].transcript||"").toLowerCase().trim();
        if(pre && t.startsWith(pre)) t=t.slice(pre.length).trim();   // keep only what was said after the gate
        else if(pre && t===pre) t="";
        if(t) alts.push(t);
      }
    }
    if(!open) return;
    if(!alts.length) return;
    if(onInterim && !anyFinal){ if(onInterim(alts)===true){ got=true; } return; }   // acted on an interim word: treat as handled
    got=true; onAlts(alts);
  };
  r.onerror=e=>{ const err=(e&&e.error)||"error"; if(err==="not-allowed"||err==="service-not-allowed"){ voice.reply=false; saveVoice(); vs.status="Microphone not allowed – voice replies turned off"; } onFail&&onFail(err); };
  r.onend=()=>{ vs.listening=false; vs.rec=null; onFail&&onFail(got?"ended":"no-speech"); renderVoiceBar(); };
  try{ r.start(); vs.rec=r; vs.listening=true; }catch(e){ onFail&&onFail("error"); }
}
const CMDS=[[/\b(che[ck]+(ed|t|d)?|cheque[ds]?|czech|chucked|checkered)\b/,"confirm"],[/\b(repeat|again|say again)\b/,"repeat"],[/\bskip\b/,"skip"],[/\b(stop|pause|cancel)\b/,"stop"]];
/* Does the transcript contain the written response (its capitalised action, brackets dropped)?
   "BOTH ON" matches "both on"; "IDLE CUTOFF" matches "idle cut off"; "1,600–1,900 RPM" matches on "rpm". */
function saidResponse(transcript, response){
  const brief=briefResponse(response);
  const words=brief.toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w.length>=2 && !["and","or","then","to","as"].includes(w));
  if(!words.length) return false;
  const t=String(transcript).toLowerCase();
  const joined=words.join("");
  if(joined.length<=3) return words.every(w=>new RegExp("\\b"+w+"\\b").test(t));
  return t.replace(/[^a-z]/g,"").includes(joined) || words.every(w=>new RegExp("\\b"+w+"\\b").test(t));
}
function listenFor(r, early){
  if(!vs.active||!voice.reply||!SR||vs.pending!==r) return;
  if(!early && vs.listening && vs.gate<=Date.now()) return;   // already listening from an early start
  let acted=false;
  const act=(alts)=>{                     // returns true when a command or option was recognised and applied
    if(acted) return true;
    if(r.type==="branch"){
      const opts=Object.keys(r.it.opts);
      for(const a of alts){ const hit=opts.find(o=>{ const w=o.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); return w.length&&a.includes(w[0]); }); if(hit){ acted=true; vs.heard=a; beep(1320,55,2); voiceChoose(r,hit); return true; } }
    }else{
      for(const a of alts){
        const wm=voice.wake?WAKE_RE.exec(a):null;
        if(wm){
          if((wm[1]||"").trim()){ acted=true; stopListening(); beep(1320,55,2); vs.active=false; vs.pending=null; handleSpokenCommand(wm[1].trim()); return true; }
          continue;                                   // "hey Aero" on its own: wait for the rest, never treat it as a reply
        }
        const c=CMDS.find(([re])=>re.test(a));
        const cmd=c?c[1]:(r.type==="item"&&saidResponse(a,r.it.r)?"confirm":(r.type==="defer"&&/\bnoted\b/.test(a)?"confirm":null));
        if(cmd){ acted=true; vs.heard=a; beep(cmd==="confirm"?1320:660,55,cmd==="confirm"?2:1); if(cmd==="confirm") voiceConfirm(); else if(cmd==="repeat") voiceRepeat(); else if(cmd==="skip") voiceSkip(); else voiceStop(); return true; }
      }
    }
    return false;
  };
  const open=()=>{
    if(!vs.active||vs.pending!==r||acted) return;
    if(!(vs.gate>Date.now())){ vs.status="Listening"; renderVoiceBar(); }
    listenOnce(alts=>{
      vs.heard=alts[0]||""; renderVoiceBar();
      if(act(alts)) return;
      vs.status="Heard “"+vs.heard+"” – say checked or the response, or repeat, skip, stop"; renderVoiceBar();
    }, err=>{
      if(!vs.active||vs.pending!==r||acted) return;
      if(err==="not-allowed"||err==="service-not-allowed"||err==="unsupported"||err==="audio-capture"||err==="language-not-supported"){ vs.status=srErrorText(err)+" – tap Checked"; renderVoiceBar(); return; }
      if(err==="network"){ vs.netFails=(vs.netFails||0)+1; if(vs.netFails>5){ vs.status="No connection for voice – tap Checked"; renderVoiceBar(); return; } setTimeout(open,1200); return; }
      setTimeout(open, 150);               // session ended or nothing heard yet: keep the microphone open while the line is pending
    }, alts=>act(alts), ()=>vs.gate||0);
  };
  vs.netFails=0;
  if(early){ open(); }                     // microphone opens while the line is still being read; results before the gate are ignored
  else setTimeout(open, 60);
}
function srErrorText(err){
  return ({"not-allowed":"Microphone not allowed for this app","service-not-allowed":"Speech recognition not allowed here","audio-capture":"No microphone found","network":"No connection for speech recognition","no-speech":"Nothing heard","aborted":"Listening stopped","unsupported":"Speech recognition not available in this app","language-not-supported":"Language not supported"})[err] || ("Speech recognition error: "+err);
}
/* Microphone test for the Status page: one listen, with the exact outcome shown. */
let micTest={state:"idle", text:""};
function runMicTest(){
  const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  const env=(standalone?"installed app":"browser tab")+", "+(navigator.onLine?"online":"offline");
  if(!SR){ micTest={state:"fail",text:"Speech recognition is not available in this "+env+". On iPad and iPhone try the same page in Safari."}; render(); return; }
  micTest={state:"listening",text:"Listening for 5 seconds – say anything ("+env+")"}; render();
  const t0=Date.now(); let settled=false;
  const finish=(st,tx)=>{ if(settled) return; settled=true; micTest={state:st,text:tx+" ("+Math.round((Date.now()-t0)/100)/10+" s, "+env+")"}; render(); };
  listenOnce(alts=>finish("ok","Heard: “"+(alts[0]||"")+"”. Recognition works on this device."), err=>finish("fail",srErrorText(err)+". Error code: "+err+"."));
  setTimeout(()=>finish("fail","No response from the recogniser after 12 s. Error code: timeout."),12000);
}

/* --- "hey Aero" wake word: a continuous listener while the app is on screen and idle --- */
const WAKE_RE=/\b(?:hey|hi|ok|okay|a|hay|hate|he|hei|hair|hay)?\s*(?:aero|arrow|arrows|arrow's|aro|airo|air o|air oh|era|aerial|arial|ariel|errol|euro|euros|zero|hero|eero|ero|erro|aero's|arrowhead|heyarrow|heyaero|hiro|nero|aeroe|aerie|airy|oreo)\b[,.!]?\s*(.*)$/i;
const ALIASES=[   // most specific first
  [/\bafter landing\b|\bpost landing\b/,"after"],
  [/\bbefore start\b|\bpre[- ]?start\b|\bpreflight\b|\bpre[- ]?flight\b|\bbefore engine start\b/,"pre"],
  [/\bafter take ?off\b|\bclimb\b/,"climb"],
  [/\b(before )?landing\b/,"land"],
  [/\bapproach\b/,"approach"],
  [/\b(pre[- ]?)?take ?off\b|\brun ?up\b|\bbefore takeoff\b/,"runup"],
  [/\bengine start\b|\bstart(ing)? (the )?engine\b|\bstart\b/,"start"],
  [/\bshut ?down\b|\bsecure\b|\bsecuring\b/,"shut"],
  [/\bcruise\b|\bcrews\b/,"cruise"],
  [/\bdescent\b|\bdescend\b|\bdecent\b|\bdissent\b|\bdescending\b|\bthe scent\b|\bthe sent\b|\bto sent\b|\bdessert\b|\bdesert\b|\bdescents?\b|\bdesent\b|\bdeescent\b|\bdesend\b|\bdecend\b|\bdissent\b|\bdescet\b/,"desc"],
  [/\btaxi\b|\btaxes\b|\btaxing\b/,"taxi"]];
let wake={on:false, busy:false, last:0, timer:null, heard:"", err:"", sessions:0, since:0};
function wakeShouldRun(){ return voice.wake && voice.reply && SR && !!AC() && document.visibilityState==="visible" && !vs.active && !recallState.on && !vs.listening && !wake.busy && !primePending && !(TTS&&speechSynthesis.speaking); }
function wakeLoop(){
  if(!wakeShouldRun()){ wake.on=false; return; }
  wake.on=true; wake.sessions++; wake.since=wake.since||Date.now(); renderWakeDot(); renderWakeStatus();
  let handled=false, pendingRest="", stableTimer=null;
  const fire=rest=>{
    if(handled) return; handled=true; wake.busy=true; clearTimeout(stableTimer); stopListening(); beep(1320,55,2); vlogAdd("wake command: “"+rest+"”");
    handleSpokenCommand(rest); setTimeout(()=>{ wake.busy=false; wakeLoop(); }, 1500);
  };
  const consider=(alts,isFinal)=>{
    wake.heard=alts[0]||""; renderWakeStatus();
    for(const a of alts){
      const m=WAKE_RE.exec(a); if(!m) continue;
      const rest=(m[1]||"").trim();
      if(!rest){ if(Date.now()-wake.last>2500){ wake.last=Date.now(); beep(880,60,1); } continue; }   // wake word heard, waiting for the rest
      if(isFinal){ fire(rest); return true; }
      // running guess: wait until it stops changing for 800 ms so the whole name is heard
      if(rest!==pendingRest){ pendingRest=rest; clearTimeout(stableTimer); stableTimer=setTimeout(()=>{ if(!handled&&pendingRest) fire(pendingRest); }, 800); }
      return false;
    }
    return false;
  };
  listenOnce(alts=>{ consider(alts,true); }, err=>{
    wake.on=false; renderWakeDot(); if(err!=="ended"&&err!=="no-speech"){ wake.err=err; } renderWakeStatus();
    if(handled) return;
    if(pendingRest){ fire(pendingRest); return; }     // session ended right after the command: use what we have
    if(err==="not-allowed"||err==="service-not-allowed"||err==="unsupported"||err==="audio-capture"){ voice.wake=false; saveVoice(); render(); return; }
    clearTimeout(wake.timer); wake.timer=setTimeout(wakeLoop, err==="network"?2000:250);
  }, alts=>consider(alts,false), ()=>0);
}
function wakeStatusText(){
  if(!voice.wake) return "Off";
  if(!voice.reply) return "Needs Voice replies on";
  if(!SR) return "Not available in this browser";
  const st=wake.on?"Listening":(vs.active?"Paused while a checklist is being read":(vs.listening?"Paused while listening for a reply":"Restarting…"));
  return st+(wake.sessions?" · "+wake.sessions+" sessions":"")+(wake.heard?" · last heard “"+wake.heard+"”":"")+(wake.err?" · last error: "+srErrorText(wake.err)+" ("+wake.err+")":"");
}
function renderWakeStatus(){ const el=document.getElementById("wakestate"); if(el) el.textContent=wakeStatusText(); }
function renderWakeDot(){ const b=$("#brand small"); if(!b) return; const d=b.querySelector(".wakedot"); if(wake.on&&!d) b.append(h("span",{class:"wakedot",title:"Listening for “hey Aero”"})); else if(!wake.on&&d) d.remove(); }
setInterval(()=>{ if(wakeShouldRun()&&!wake.on) wakeLoop(); }, 1000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState!=="visible"){ if(wake.on){ stopListening(); wake.on=false; } } });

/* Spoken command after the wake word (or from the Say procedure button): a checklist/procedure name, "status" or "stop". */
function handleSpokenCommand(text){
  const t=text.toLowerCase().replace(/\b(the|a|an|please|checklist|check list|procedure|open|go to|show|read|me)\b/g," ").replace(/\s+/g," ").trim();
  if(/\bstop\b|\bcancel\b|\bquiet\b/.test(t)){ voiceStop(); return true; }
  if(/\bstatus\b/.test(t)){ state.mode="status"; state.sel=null; state.showing=true; save(); render(); speak("Status."); return true; }
  const a=AC(); if(!a) return false;
  let target=null;
  {  // 1. a checklist or procedure whose full name was said wins outright
    const said=" "+t.replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()+" ";
    const all=["normal","emergency","abnormal"].flatMap(m=>DATA()[m].map(p=>({m,p})));
    const hit=all.filter(x=>said.includes(" "+x.p.name.toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()+" ")).sort((x,y)=>y.p.name.length-x.p.name.length)[0];
    if(hit) target=hit;
  }
  const shortPhrase = !target && t.split(/\s+/).length<=3 && !/\b(fail|failure|fire|emergency|smoke|loss|unsafe|overspeed|decompression|runaway|gear|flap|flaps|manual|spin|icing|ice|door|alternator|generator|electrical|oil|fuel|vacuum|pressure|caps|parachute|single|engine)\b/.test(t);
  if(shortPhrase) for(const [re,id] of ALIASES){ if(re.test(t)){ if(id==="approach"){ target=customApproach(a.id)?{m:"normal",p:DATA().normal.find(p=>p.id===CUSTOM_ID)}:null; if(!target) continue; } else { const p=DATA().normal.find(p=>p.id===id); if(p) target={m:"normal",p}; } if(target) break; } }
  if(!target){
    const all=["emergency","abnormal","normal"].flatMap(m=>DATA()[m].map(p=>({m,p})));
    const norm=x=>x.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w&&!["the","a","an","in","of","and","or","to"].includes(w));
    const words=norm(t); let best=null,bestScore=0;
    const said=" "+words.join(" ")+" ";
    const lev=(a,b)=>{ if(a===b) return 0; const m=a.length,n=b.length; if(!m||!n) return m+n; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; };
    const close=(w,n)=>w.length>=5&&n.length>=5&&lev(w,n)<=(w.length>=8?3:2);
    for(const x of all){
      const nameWords=norm(x.p.name); const nw=nameWords.concat(norm(x.p.cond||""));
      let sc=0; for(const w of words){ if(nw.includes(w)) sc+=2; else if(nw.some(n=>n.startsWith(w)&&w.length>3)) sc+=1; else if(nameWords.some(n=>close(w,n))) sc+=2; }
      if(nameWords.length && said.includes(" "+nameWords.join(" ")+" ")) sc+=6;          // the whole name was said
      else if(nameWords.every(n=>words.includes(n))) sc+=3;                                // every word of the name was said
      sc-=Math.max(0,nameWords.length-words.length)*0.5;                                  // longer names that were not fully said lose a little
      if(sc>bestScore){bestScore=sc;best=x;}
    }
    if(best&&bestScore>=2) target=best;
  }
  if(!target){ vlogAdd("no match for “"+text+"”"); recallState.msg="Heard “"+text+"” – no matching checklist."; render(); speak("No matching checklist."); return false; }
  vlogAdd("opening "+target.p.name+" (heard “"+text+"”)");
  recallState.msg=""; state.mode=target.m; state.sel=target.p.id; state.showing=true; save(); render();
  if(!voice.read){ voice.read=true; saveVoice(); vlogAdd("read aloud turned on by voice command"); render(); }   // a spoken request to open a checklist means: read it
  voiceStart(true);
  return true;
}

/* --- tap-then-speak recall of a procedure --- */
let recallState={on:false,msg:""};
function voiceRecall(){
  if(!SR){ recallState.msg="Speech recognition is not available in this browser."; render(); return; }
  recallState.on=true; recallState.msg="Listening… say the procedure name"; render();
  let done=false;
  listenOnce(alts=>{
    if(done) return; done=true; recallState.on=false;
    const said=(alts[0]||"").replace(WAKE_RE,"$1");
    handleSpokenCommand(said||alts[0]||"");
  }, err=>{ if(done) return; done=true; recallState.on=false; recallState.msg=err==="not-allowed"?"Microphone not allowed.":err==="network"?"No connection for voice recognition.":"Nothing heard – tap the microphone and try again."; render(); });
}

/* --- voice bar --- */
function renderVoiceBar(){
  const old=document.getElementById("vbar"); if(old) old.remove();
  const main=$("#main");
  const c=currentRows();
  const show=voice.read && c && state.mode!=="status" && state.mode!=="charts" && state.sel!=="__vs" && (state.showing || window.innerWidth>760);
  main.classList.toggle("voice-on",!!show);
  if(!show){ if(vs.active) voiceStop(true); return; }
  if(vs.pid!==c.p.id){ vs.pid=c.p.id; vs.active=false; vs.pending=null; vs.readNotes={}; vs.skipped={}; vs.status=""; vs.heard=""; }
  const r=vs.pending;
  const cur=r ? (r.type==="branch" ? h("div",{class:"cur"},h("b",{},r.it.branch)) : h("div",{class:"cur"},(r.type==="defer"?"Deferred: "+r.it.defer:r.it.c)+" ",h("b",{},r.type==="defer"?"NOTED":r.it.r)))
              : h("div",{class:"cur"},vs.active?"…":"Read aloud is on. Tap Start to hear this checklist.");
  const st=h("div",{class:"st"},vs.listening?h("span",{class:"lis"}):"",vs.status||(vs.active?"Reading":"Ready"));
  const btns=h("div",{class:"btns"});
  if(!vs.active){ btns.append(h("button",{onclick:()=>{ if(!vs.active) voiceStart(); }},"▶ Start")); }
  else{
    btns.append(h("button",{class:"stop",onclick:()=>voiceStop()},"■ Stop"));
    btns.append(h("button",{onclick:voiceRepeat},"Repeat"));
    if(r&&r.type!=="branch") btns.append(h("button",{onclick:voiceSkip},"Skip"));
    if(r&&r.type!=="branch") btns.append(h("button",{class:"ok",onclick:voiceConfirm},"✓ Checked"));
  }
  const bar=h("div",{class:"vbar",id:"vbar"},st,cur,btns);
  if(vs.heard) bar.append(h("div",{class:"heard"},"Heard: “"+vs.heard+"”"));
  document.body.append(bar);
}

/* ---------------- BOOT ---------------- */
function applyHash(){
  const id=(location.hash||"").replace(/^#/,"");
  if(id && byId(id) && id!==state.ac){ selectAircraft(id); return true; }
  return false;
}
function start(){
  applyTheme();
  load();
  if(!applyHash() && state.ac && !byId(state.ac)) state.ac=null;
  if(AIRCRAFT.length===1 && !state.ac) selectAircraft(AIRCRAFT[0].id);
  render();
  loadChanges().then(()=>{ showAppliedNotice(); render(); });
  window.addEventListener("hashchange", ()=>{ if(applyHash()){ save(); render(); } });
  document.addEventListener("pointerdown", keepAwake, {once:true});
}
start();
</script>
