  --on-green:#042a18; --on-amber:#1a1200; --on-red:#ffffff;
  --radius:6px;
}
@media (prefers-color-scheme: light){

    color-scheme: light;
    --bg:#eef1f3; --panel:#ffffff; --panel-2:#f3f6f8; --line:#d3dade;
    --ink:#131a1f; --ink-dim:#5a6873; --ink-mute:#8e9ba5;
    --amber:#b7780a; --red:#c2322a; --green:#1f8f55; --cyan:#1a7f9c;

    --on-green:#ffffff; --on-amber:#ffffff; --on-red:#ffffff;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef1f3; --panel:#ffffff; --panel-2:#f3f6f8; --line:#d3dade;

   Item types:

const CATEGORIES = ["Single-engine piston","High-performance single","Multi-engine piston","Turboprop"];
const AIRCRAFT = (window.AIRCRAFT || []).slice().sort((a,b)=>CATEGORIES.indexOf(a.category)-CATEGORIES.indexOf(b.category) || (a.maker+a.model).localeCompare(b.maker+b.model));

const LEGACY_KEY = "c208b-ecl-v1";

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && typeof s==="object"){
        if(s.per && typeof s.per==="object") state.per = s.per;
        if(typeof s.ac==="string" && byId(s.ac)) state.ac = s.ac;
        if(typeof s.lastAc==="string" && byId(s.lastAc)) state.lastAc = s.lastAc;
        if(Array.isArray(s.fav)) state.fav = s.fav.filter(id=>byId(id));
        if(s.uses && typeof s.uses==="object") state.uses = s.uses;
        if(s.favAsked && typeof s.favAsked==="object") state.favAsked = s.favAsked;
        if(s.custom && typeof s.custom==="object") state.custom = s.custom;
        if(s.wb && typeof s.wb==="object") state.wb = s.wb;
        if(s.perf && typeof s.perf==="object") state.perf = s.perf;
        if(s.manifest && typeof s.manifest==="object") state.manifest = s.manifest;
        if(s.records && typeof s.records==="object") state.records = s.records;
        if(s.ops && typeof s.ops==="object") state.ops = Object.assign(state.ops, s.ops); if(!state.ops.std) state.ops.std={}; if(!state.ops.noticesRead) state.ops.noticesRead={}; if(!Array.isArray(state.ops.notices)) state.ops.notices=[];
        if(s.duty && typeof s.duty==="object") state.duty = Object.assign(state.duty, s.duty); if(!Array.isArray(state.duty.log)) state.duty.log=[];
        if(s.pilot && typeof s.pilot==="object") state.pilot = s.pilot;
        if(Array.isArray(s.outbox)) state.outbox = s.outbox;
        if(s.plan && typeof s.plan==="object") state.plan = s.plan;
        if(s.sharedApproach && typeof s.sharedApproach==="object") state.sharedApproach = {on:!!s.sharedApproach.on, name:String(s.sharedApproach.name||""), items:Array.isArray(s.sharedApproach.items)?s.sharedApproach.items:[]};
        if(MODES.some(([m])=>m===s.mode)) state.mode = s.mode;
        if(typeof s.sel==="string"||s.sel===null) state.sel = s.sel;
        state.showing = !!s.showing;
        state.savedAt = s.savedAt||null;
      }
    }else{
      // carry over progress from the single-aircraft C208B version
      const old = localStorage.getItem(LEGACY_KEY);
      if(old){
        const s = JSON.parse(old);
        if(s && s.ticks) state.per.c208b = {ticks:s.ticks||{}, branches:s.branches||{}};
      }
    }
  }catch(e){ /* storage unavailable: run without it */ }
}
function save(){
  state.savedAt = Date.now();
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({per:state.per, ac:state.ac, lastAc:state.lastAc, fav:state.fav, uses:state.uses, favAsked:state.favAsked, custom:state.custom, sharedApproach:state.sharedApproach, wb:state.wb, perf:state.perf, manifest:state.manifest, records:state.records, ops:state.ops, duty:state.duty, pilot:state.pilot, outbox:state.outbox, plan:state.plan, mode:state.mode, sel:state.sel, showing:state.showing, savedAt:state.savedAt}));

/* Day / night display: "auto" follows the phone, "day" and "night" force it. Remembered per device. */
const THEME_KEY = "ga-ecl-theme";
const THEMES = [["auto","Auto","◐"],["day","Day","☀"],["night","Night","☾"]];
let theme = "auto";
try{ const t=localStorage.getItem(THEME_KEY); if(THEMES.some(x=>x[0]===t)) theme=t; }catch(e){}
function applyTheme(){
  const root=document.documentElement;
  if(theme==="night") root.setAttribute("data-theme","dark");
  else if(theme==="day") root.setAttribute("data-theme","light");
  else root.removeAttribute("data-theme");
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  const dark = theme==="night" || (theme==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  let m=document.querySelector('meta[name="theme-color"]:not([media])');
  if(!m){ m=document.createElement("meta"); m.name="theme-color"; document.head.prepend(m); }
  m.content = dark ? "#1b2329" : "#ffffff";
}
function cycleTheme(){ const i=THEMES.findIndex(x=>x[0]===theme); theme=THEMES[(i+1)%THEMES.length][0]; applyTheme(); render(); }
function renderThemeButton(){
  const b=$("#theme"); b.innerHTML="";
  const t=THEMES.find(x=>x[0]===theme);
  b.className="theme"+(theme!=="auto"?" on":"");
  b.title="Display: "+t[1]+" (tap to change)";
  b.append(h("span",{class:"g"},t[2]),h("span",{},t[1]));
  b.onclick=cycleTheme;
}

/* Keep the screen awake while a checklist is open (silently skipped where not allowed). */
let wakeLock = null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator) || wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") keepAwake(); });

function proc(mode,id){return (DATA()[mode]||[]).find(p=>p.id===id)}
function key(pid,path){return pid+"/"+path}

/* Flatten a procedure into visible rows given current branch selections */
function rows(p){
  const out=[]; const per=PER();
  const walk=(items,prefix)=>items.forEach((it,i)=>{
    const path=prefix+i;
    if(it.branch){
      const chosen=per.branches[key(p.id,path)];
      out.push({type:"branch",it,path,chosen});
      if(chosen && it.opts[chosen]) walk(it.opts[chosen],path+"."+chosen+".");
    }else if(it.note){out.push({type:"note",it,path})}
    else if(it.defer){out.push({type:"defer",it,path})}
    else out.push({type:"item",it,path});
  });
  walk(p.items,"");
  return out;
}
function actionable(r){return r.type==="item"||r.type==="defer"}
function isDone(p,r){return !!PER().ticks[key(p.id,r.path)]}
function progress(p){
  const all=rows(p);
  const rs=all.filter(actionable);
  const d=rs.filter(r=>isDone(p,r)).length;
  const open=all.some(r=>r.type==="branch"&&!r.chosen);
  return {done:d,total:rs.length,complete:rs.length>0&&d===rs.length&&!open};
}
function resetProc(p){
  const per=PER();
  Object.keys(per.ticks).forEach(k=>{if(k.startsWith(p.id+"/"))delete per.ticks[k]});
  Object.keys(per.branches).forEach(k=>{if(k.startsWith(p.id+"/"))delete per.branches[k]});
}
function withAircraft(aid, fn){ const prev=state.ac; state.ac=aid; try{ return fn(); } finally { state.ac=prev; } }
function activeNonNormal(aid){
  return withAircraft(aid||state.ac, ()=>["emergency","abnormal"].flatMap(m=>DATA()[m].map(p=>({m,p}))).filter(x=>{const pr=progress(x.p);return pr.done>0&&!pr.complete}));
}
function deferredItems(){
  const out=[];
  ["emergency","abnormal"].forEach(m=>DATA()[m].forEach(p=>rows(p).forEach(r=>{if(r.type==="defer"&&isDone(p,r))out.push({p,text:r.it.defer})})));
  return out;
}
function aircraftSummary(a){
  return withAircraft(a.id, ()=>{
    const act=activeNonNormal(a.id).length;
    const norm=withCustom(a).map(progress);
    const started=norm.filter(p=>p.done>0).length, complete=norm.filter(p=>p.complete).length;
    return {act, started, complete, total:withCustom(a).length};
  });
}

const FAV_PROMPT_AT = 3;          // opens before the app suggests adding an aircraft to favourites
const FAV_PROMPT_AGAIN = 10;      // further opens before asking again after "Not now"

/* After a tick, keep the next item to action in the upper part of the pane with the following items visible. */
function followNext(ve){
  const nx=ve.querySelector(".item.next"); if(!nx) return;
  const vr=ve.getBoundingClientRect(), r=nx.getBoundingClientRect();
  const head=ve.querySelector(".proc-head"); const top=vr.top+(head?head.getBoundingClientRect().height:0);
  const bar=document.getElementById("vbar"); const bottom=vr.bottom-(bar?bar.getBoundingClientRect().height:0);

  const wantTop=top+Math.min(120, room*0.22);                                              // where the next item should sit
  const hidden = r.bottom>bottom-8 || r.top<top+8;
  const lowOnScreen = r.top>top+room*0.5;                                                 // visible, but too little left below it
  if(hidden||lowOnScreen){ const target=ve.scrollTop+(r.top-wantTop); try{ ve.scrollTo({top:Math.max(0,target),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }catch(e){ ve.scrollTop=Math.max(0,target); } }
}

function renderView(){

    h("button",{class:"back",onclick:()=>go(()=>{state.showing=false})},"‹ Back"),
    h("h1",{class:cls},p.name,p.cond?h("span",{class:"cond"},p.cond):(p.edited?h("span",{class:"cond"},"Customised on this device"):"")),
    h("div",{class:"tools"},state.mode==="normal"?h("button",{onclick:()=>openEditor(p.id)},"Edit"):"",h("button",{onclick:()=>{render._top=true;go(()=>resetProc(p))}},"Reset"))
  );

function wbSvg(p,res){

  pts.forEach(q=>{ g+=`<circle cx="${X(q.arm)}" cy="${Y(q.w)}" r="6" fill="${q.env===false?"var(--red)":colors[q.label]}" stroke="var(--panel)" stroke-width="2"/><text x="${X(q.arm)+9}" y="${Y(q.w)+4}" font-size="12" font-weight="600" fill="var(--ink)">${q.label}</text>`; });

  g+=`<text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--ink-dim)">Weight (${p.units.weight})</text>`;

/* Update awareness.
   - A bar appears while the app is open if a new build has been downloaded (tap to refresh).
   - On reopening after an update was applied, a one-time "updated" bar says so.
   - The Status page shows the version, the last check time and a manual check button. */
const UPD_KEY = "ga-ecl-build";
let updInfo = {lastCheck:null, waiting:false};
function updateState(){
  if(NATIVE) return "Updates arrive through the App Store / Google Play";
  if(updInfo.waiting) return "New version ready – refresh";
  return updInfo.lastCheck ? "Up to date · checked "+new Date(updInfo.lastCheck).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Not checked yet";
}
function refreshUpdState(){ const el=document.getElementById("updstate"); if(el){ el.textContent=updateState(); el.classList.toggle("ready",updInfo.waiting); } }
function showBar(id, text, cls, actions){
  if(document.getElementById(id)) return null;
  const bar=document.createElement("div"); bar.id=id; bar.className="upd "+(cls||"");
  const txt=document.createElement("span"); txt.className="t"; txt.textContent=text; bar.append(txt);
  actions.forEach(action=>{ const b=document.createElement("button"); b.className="x"; b.textContent=action.label; b.onclick=()=>{ action.run(bar); }; bar.append(b); });
  document.getElementById("app").insertBefore(bar, document.getElementById("main"));
  return bar;
}
let latestChanges=null;
function showUpdateReady(){
  updInfo.waiting=true; refreshUpdState();
  const bar=showBar("upd","A new version is ready.","ready",[
    {label:"What's new",run:()=>showWhatsNew(latestChanges&&latestChanges.length?latestChanges.filter(e=>e.version!==APP_VERSION()):null,"In the new version")},
    {label:"Refresh now",run:b=>{b.textContent="Refreshing…";location.reload();}}]);
  fetchLatestChanges().then(j=>{ if(!j||!j.length) return; latestChanges=j; const top=j[0]; if(bar&&top&&top.version!==APP_VERSION()){ bar.querySelector(".t").textContent="Version "+top.version+" is ready: "+top.title+"."; } });
}
let appliedNotice=false;
(function noticeAppliedUpdate(){
  try{
    const prev=localStorage.getItem(UPD_KEY);
    if(prev && prev!==BUILD) appliedNotice=true;
    localStorage.setItem(UPD_KEY, BUILD);
  }catch(e){}
})();
function showAppliedNotice(){
  if(!appliedNotice) return;
  const top=CHANGES[0];
  const text= top ? "Updated to version "+top.version+": "+top.title+"." : "AeroE Checklist was updated to build "+BUILD+".";
  showBar("updok",text,"info",[{label:"What's new",run:()=>showWhatsNew(null,"What's new")},{label:"OK",run:b=>b.remove()}]);
}
let swReg=null;
function checkForUpdate(manual){
  if(!swReg){ if(manual){ updInfo.lastCheck=Date.now(); refreshUpdState(); } return; }
  swReg.update().then(()=>{ updInfo.lastCheck=Date.now(); refreshUpdState(); }).catch(()=>{ updInfo.lastCheck=Date.now(); refreshUpdState(); });
}
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      swReg=reg; updInfo.lastCheck=Date.now(); refreshUpdState();
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateReady();
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw && nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdateReady();
        });
      });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(false); });
      setInterval(() => checkForUpdate(false), 6 * 60 * 60 * 1000);
    }).catch(() => {});
  });
}

  const env=(standalone?"installed app":"browser tab")+", "+(navigator.onLine?"online":"offline")+", "+((voice.offline&&vosk.state==="ready")?"on-device engine":"browser engine");
  if(!SRX()){ micTest={state:"fail",text:"Speech recognition is not available in this "+env+". On iPad and iPhone try the same page in Safari."}; render(); return; }
  micTest={state:"listening",text:"Listening for 5 seconds – say anything ("+env+")"}; render();
  const t0=Date.now(); let settled=false;
  const finish=(st,tx)=>{ if(settled) return; settled=true; micTest={state:st,text:tx+" ("+Math.round((Date.now()-t0)/100)/10+" s, "+env+")"}; render(); };
  listenOnce(alts=>finish("ok","Heard: “"+(alts[0]||"")+"”. Recognition works on this device."), err=>finish("fail",srErrorText(err)+". Error code: "+err+"."));
  setTimeout(()=>finish("fail","No response from the recogniser after 12 s. Error code: timeout."),12000);
}

/* ---------------- OFFLINE RECOGNITION (Vosk, runs on the device) ----------------
   An optional on-device recogniser (vosk-browser, Apache-2.0) with a 41 MB English model, downloaded once and kept in
   its own cache. It is restricted to the phrases the app expects (commands, responses, checklist names, "hey Aero"),
   which makes it accurate in noise. It presents the same interface as the browser's SpeechRecognition so the rest of
   the voice code does not change. */
const OFF={lib:"offline/vosk.js", model:"offline/vosk-model-small-en-us-0.15.tar.gz", cacheName:"ga-ecl-offline", sizeMB:46};
const vosk={state:"off", progress:0, msg:"", model:null, rec:null, grammarKey:"", stream:null, ctx:null, src:null, proc:null, sink:null, session:null, ignoreNext:false, lastRate:16000};
function offlineStatusText(){
  switch(vosk.state){
    case "off": return voice.offline?(NATIVE?"Loading…":"Not downloaded – tap Download ("+OFF.sizeMB+" MB, once)"):"Off";
    case "downloading": return "Downloading "+Math.round(vosk.progress*100)+"% of "+OFF.sizeMB+" MB…";
    case "downloaded": return "Downloaded – loading…";
    case "loading": return "Loading the model into memory…";
    case "ready": return "Ready – words are recognised on this device, no signal needed"+(vosk.msg?" · "+vosk.msg:"");
    case "error": return "Problem: "+vosk.msg;
  } return vosk.state;
}
function renderOfflineStatus(){ const el=document.getElementById("offstate"); if(el) el.textContent=offlineStatusText(); const bar=document.getElementById("offbar"); if(bar) bar.style.width=Math.round(vosk.progress*100)+"%"; }
async function offlineIsDownloaded(){ if(NATIVE) return true; try{ const c=await caches.open(OFF.cacheName); return !!(await c.match(OFF.lib,{ignoreSearch:true})) && !!(await c.match(OFF.model,{ignoreSearch:true})); }catch(e){ return false; } }
async function offlineDownload(){
  vosk.state="downloading"; vosk.progress=0; vosk.msg=""; renderOfflineStatus(); vlogAdd("offline download started");
  try{
    const parts=[[OFF.lib,0.12],[OFF.model,0.88]]; let base=0; let cache=null; try{ cache=await caches.open(OFF.cacheName); }catch(e){}
    for(const [u,w] of parts){
      if(cache && await cache.match(u,{ignoreSearch:true})){ base+=w; vosk.progress=base; renderOfflineStatus(); continue; }
      const res=await fetch(u,{cache:"no-cache"}); if(!res.ok) throw new Error("HTTP "+res.status+" for "+u);
      const total=+res.headers.get("Content-Length")||0; const chunks=[]; let got=0;
      if(res.body&&res.body.getReader){ const reader=res.body.getReader(); while(true){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length; vosk.progress=base+(total?Math.min(1,got/total):0.5)*w; renderOfflineStatus(); } }
      else { const ab=await res.arrayBuffer(); chunks.push(new Uint8Array(ab)); got=ab.byteLength; }
      if(cache && !(await cache.match(u,{ignoreSearch:true}))){   // not stored by the service worker (none running): keep a copy ourselves
        const blob=new Blob(chunks,{type:res.headers.get("Content-Type")||"application/octet-stream"});
        try{ await cache.put(u,new Response(blob,{headers:{"Content-Type":blob.type,"Content-Length":String(blob.size)}})); }catch(e){ vosk.msg="could not be kept offline (storage)"; }
      }
      base+=w; vosk.progress=base; renderOfflineStatus();
    }
    vosk.state="downloaded"; renderOfflineStatus(); vlogAdd("offline download complete"); return true;
  }catch(e){ vosk.state="error"; vosk.msg=String(e&&e.message||e); vlogAdd("offline download failed: "+vosk.msg); renderOfflineStatus(); return false; }
}
function loadScript(src){ return new Promise((ok,fail)=>{ if(window.Vosk) return ok(); const el=document.createElement("script"); el.src=src; el.onload=()=>ok(); el.onerror=()=>fail(new Error("could not load "+src)); document.head.append(el); }); }
async function offlineLoad(){
  if(vosk.model){ vosk.state="ready"; renderOfflineStatus(); return true; }
  vosk.state="loading"; vosk.msg=""; renderOfflineStatus();
  try{
    await loadScript(OFF.lib);
    const url=new URL(OFF.model, location.href).href;
    vosk.model=await Vosk.createModel(url, 0);
    vosk.state="ready"; vlogAdd("offline model ready"); renderOfflineStatus(); render(); return true;
  }catch(e){ vosk.state="error"; vosk.msg="could not load the model: "+String(e&&e.message||e); vlogAdd("offline load failed: "+vosk.msg); renderOfflineStatus(); return false; }
}
async function offlineEnable(){
  voice.offline=true; saveVoice(); render();
  if(!(await offlineIsDownloaded())){ if(!(await offlineDownload())) return; }
  await offlineLoad();
}
function offlineTeardown(){ offlineCloseAudio(); if(vosk.rec){ try{ vosk.rec.remove(); }catch(e){} vosk.rec=null; vosk.grammarKey=""; } if(vosk.model){ try{ vosk.model.terminate(); }catch(e){} vosk.model=null; } vosk.state="off"; }
async function offlineRemove(){ voice.offline=false; saveVoice(); offlineTeardown(); try{ await caches.delete(OFF.cacheName); }catch(e){} vosk.state="off"; vosk.msg=""; vlogAdd("offline model removed"); render(); }

/* The phrases the recogniser may return. Built for the current aircraft and rebuilt when it changes. */
function offlineGrammar(){
  const phrases=new Set();
  const add=p=>{ p=String(p).toLowerCase().replace(/[^a-z' ]+/g," ").replace(/\s+/g," ").trim(); if(p&&p.length<=60) phrases.add(p); };
  ["checked","check","set","complete","done","repeat","again","say again","skip","stop","noted","yes","no","status","cancel","pause"].forEach(add);
  ["hey aero","hey aero status","hey aero stop"].forEach(add);
  const a=AC();
  if(a){
    const all=["normal","emergency","abnormal"].flatMap(m=>DATA()[m]);
    for(const p of all){
      add(p.name); add("hey aero "+p.name); add("hey aero "+p.name+" checklist"); add(p.name+" checklist");
      const walk=items=>items.forEach(it=>{ if(it.branch){ Object.keys(it.opts).forEach(o=>{ add(o.split(/[^a-z0-9]+/i)[0]); walk(it.opts[o]); }); } else if(it.r){ add(briefResponse(it.r)); } });
      walk(p.items);
    }
    ["landing checklist","before landing","after landing","before start","engine start","start checklist","before takeoff","takeoff checklist","after takeoff","climb checklist","cruise checklist","descent checklist","taxi checklist","shutdown checklist","approach checklist","emergency descent"].forEach(x=>{ add(x); add("hey aero "+x); });
  }
  phrases.add("[unk]");
  return JSON.stringify([...phrases]);
}
async function offlineStartMic(){
  if(vosk.stream&&vosk.ctx&&vosk.stream.getTracks().some(t=>t.readyState==="live")){ if(vosk.ctx.state==="suspended") await vosk.ctx.resume(); return true; }
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false});
  const AC_=window.AudioContext||window.webkitAudioContext;
  if(!vosk.ctx||vosk.ctx.state==="closed"){ vosk.ctx=new AC_(); vosk.proc=vosk.ctx.createScriptProcessor(4096,1,1); vosk.sink=vosk.ctx.createGain(); vosk.sink.gain.value=0; vosk.proc.connect(vosk.sink); vosk.sink.connect(vosk.ctx.destination);
    vosk.proc.onaudioprocess=ev=>{ if(!vosk.session||!vosk.rec) return; try{ vosk.rec.acceptWaveformFloat(ev.inputBuffer.getChannelData(0), vosk.ctx.sampleRate); }catch(e){} }; }
  if(vosk.ctx.state==="suspended") await vosk.ctx.resume();
  try{ vosk.src&&vosk.src.disconnect(); }catch(e){}
  vosk.src=vosk.ctx.createMediaStreamSource(stream); vosk.src.connect(vosk.proc);
  vosk.stream=stream; vosk.lastRate=vosk.ctx.sampleRate; vlogAdd("offline microphone open ("+vosk.ctx.sampleRate+" Hz)"); return true;
}
/* Release the microphone (stop the track, suspend the engine) without rebuilding the audio engine each time */
function offlineStopMic(){ if(!vosk.stream&&!vosk.ctx) return; try{ vosk.stream&&vosk.stream.getTracks().forEach(t=>t.stop()); }catch(e){} try{ vosk.src&&vosk.src.disconnect(); }catch(e){} vosk.src=null; vosk.stream=null; try{ vosk.ctx&&vosk.ctx.state==="running"&&vosk.ctx.suspend(); }catch(e){} }
function offlineCloseAudio(){ offlineStopMic(); try{ vosk.ctx&&vosk.ctx.close(); }catch(e){} vosk.ctx=vosk.proc=vosk.sink=null; }
function offlineEnsureRec(){
  const a=AC(); const key=(a?a.id:"-")+":"+vosk.lastRate+":"+(a?editedCount(a.id):0)+":"+(state.sharedApproach.on?1:0)+":"+(a?withCustom(a).length:0);
  if(vosk.rec&&vosk.grammarKey===key) return vosk.rec;
  if(vosk.rec){ try{ vosk.rec.remove(); }catch(e){} }
  const rec=new vosk.model.KaldiRecognizer(vosk.lastRate, offlineGrammar());
  try{ rec.setWords(false); }catch(e){}
  rec.on("result", m=>offlineOnResult((m&&m.result&&m.result.text)||"", true));
  rec.on("partialresult", m=>offlineOnResult((m&&m.result&&m.result.partial)||"", false));
  rec.on("error", m=>vlogAdd("offline recogniser error: "+(m&&m.error)));
  vosk.rec=rec; vosk.grammarKey=key; return rec;
}
function offlineOnResult(text,isFinal){
  if(vosk.ignoreNext){ if(isFinal) vosk.ignoreNext=false; return; }
  const sess=vosk.session; if(!sess) return;
  if(isFinal) sess._onFinal(text); else sess._onPartial(text);
}
/* Same shape as the browser's SpeechRecognition, backed by the on-device engine */
class VoskRecognition{
  constructor(){ this.lang=""; this.interimResults=false; this.maxAlternatives=1; this.continuous=false; this.onstart=null; this.onresult=null; this.onerror=null; this.onend=null; this.onaudiostart=null; this._ended=false; this._finals=[]; this._partial=""; this._timer=null; }
  async start(){
    if(vosk.session&&vosk.session!==this) vosk.session.abort();
    if(!vosk.model){ this._fail("offline-not-ready"); return; }
    try{ await offlineStartMic(); }catch(e){ this._fail(e&&(e.name==="NotAllowedError"||e.name==="SecurityError")?"not-allowed":"audio-capture"); return; }
    if(this._ended) return;
    try{ offlineEnsureRec(); }catch(e){ vlogAdd("offline grammar failed: "+e); this._fail("offline-not-ready"); return; }
    vosk.session=this; vosk.ignoreNext=true; try{ vosk.rec.retrieveFinalResult(); }catch(e){ vosk.ignoreNext=false; }
    this._finals=[]; this._partial="";
    this.onstart&&this.onstart(); this.onaudiostart&&this.onaudiostart();
    if(!this.continuous) this._timer=setTimeout(()=>{ if(!this._ended&&!this._finals.length) this._fail("no-speech"); }, 8000);
  }
  _emit(){ const results=this._finals.map(t=>Object.assign([{transcript:t,confidence:0.9}],{isFinal:true})); if(this._partial) results.push(Object.assign([{transcript:this._partial,confidence:0.5}],{isFinal:false})); this.onresult&&this.onresult({results,resultIndex:Math.max(0,results.length-1)}); }
  _onPartial(t){ if(this._ended) return; t=String(t).replace(/\[unk\]/g,"").replace(/\s+/g," ").trim(); if(!this.interimResults||!t||t===this._partial) return; this._partial=t; this._emit(); }
  _onFinal(t){ if(this._ended) return; t=String(t).replace(/\[unk\]/g,"").replace(/\s+/g," ").trim(); this._partial=""; if(!t) return; this._finals.push(t); this._emit(); if(!this.continuous) this._end(); }
  _fail(err){ if(this._ended) return; this.onerror&&this.onerror({error:err}); this._end(); }
  _end(){ if(this._ended) return; this._ended=true; clearTimeout(this._timer); if(vosk.session===this) vosk.session=null; this.onend&&this.onend(); }
  abort(){ if(this._ended) return; this._ended=true; clearTimeout(this._timer); if(vosk.session===this) vosk.session=null; this.onend&&this.onend(); }
  stop(){ this.abort(); }
}

/* --- "hey Aero" wake word: a continuous listener while the app is on screen and idle --- */
const WAKE_RE=/\b(?:hey|hi|ok|okay|a|hay|hate|he|hei|hair|hay)?\s*(?:aero|arrow|arrows|arrow's|aro|airo|air o|air oh|era|aerial|arial|ariel|errol|euro|euros|zero|hero|eero|ero|erro|aero's|arrowhead|heyarrow|heyaero|hiro|nero|aeroe|aerie|airy|oreo)\b[,.!]?\s*(.*)$/i;
const ALIASES=[   // most specific first
  [/\bafter landing\b|\bpost landing\b/,"after"],
  [/\bbefore start\b|\bpre[- ]?start\b|\bpreflight\b|\bpre[- ]?flight\b|\bbefore engine start\b/,"pre"],
  [/\bafter take ?off\b|\bclimb\b/,"climb"],
  [/\b(before )?landing\b/,"land"],
  [/\bapproach\b/,"approach"],
  [/\b(pre[- ]?)?take ?off\b|\brun ?up\b|\bbefore takeoff\b/,"runup"],
  [/\bengine start\b|\bstart(ing)? (the )?engine\b|\bstart\b/,"start"],
  [/\bshut ?down\b|\bsecure\b|\bsecuring\b/,"shut"],
  [/\bcruise\b|\bcrews\b/,"cruise"],
  [/\bdescent\b|\bdescend\b|\bdecent\b|\bdissent\b|\bdescending\b|\bthe scent\b|\bthe sent\b|\bto sent\b|\bdessert\b|\bdesert\b|\bdescents?\b|\bdesent\b|\bdeescent\b|\bdesend\b|\bdecend\b|\bdissent\b|\bdescet\b/,"desc"],
  [/\btaxi\b|\btaxes\b|\btaxing\b/,"taxi"]];
let wake={on:false, busy:false, last:0, timer:null, heard:"", err:"", sessions:0, since:0};
function wakeShouldRun(){ return voice.wake && voice.reply && SRX() && !!AC() && document.visibilityState==="visible" && !vs.active && !recallState.on && !vs.listening && !wake.busy && !primePending && !(TTS&&speechSynthesis.speaking); }
function wakeLoop(){
  if(!wakeShouldRun()){ wake.on=false; return; }
  wake.on=true; wake.sessions++; wake.since=wake.since||Date.now(); renderWakeDot(); renderWakeStatus();
  let handled=false, pendingRest="", stableTimer=null, fragment="", fragmentAt=0, awaitingAt=0, latest="", graceTimer=null;
  const fire=rest=>{
    if(handled) return; handled=true; wake.busy=true; clearTimeout(stableTimer); clearTimeout(graceTimer); stopListening(); beep(1500,30,1,0.07); vlogAdd("wake command: “"+rest+"”");
    handleSpokenCommand(rest); setTimeout(()=>{ wake.busy=false; wakeLoop(); }, 1500);
  };
  const unfinished=rest=>/\b(before|after|engine|low|high|emergency|gear|fuel|cabin|electrical|pre|post|manual|single|loss|rapid|smoke|flap|flaps|oil|alternator|generator|and|or|the|of|in|to|a)$/.test(rest);
  const holdOpen=()=>{ clearTimeout(graceTimer); graceTimer=setTimeout(()=>{ if(!handled&&latest) fire(latest); }, 2500); };
  const processed=new Set();   // finished phrases already dealt with (the engine keeps reporting them)
  const consider=(alts,isFinal)=>{
    wake.heard=alts[alts.length-1]||""; renderWakeStatus();
    let lastRest=null;
    for(const a of alts){
      if(processed.has(a)) continue;
      const m=WAKE_RE.exec(a);
      let rest;
      if(m){
        rest=(m[1]||"").trim();
        if(!rest){ // wake word on its own: acknowledge once and wait for the command
          if(Date.now()-wake.last>2500){ wake.last=Date.now(); beep(880,60,1); }
          if(isFinal){ processed.add(a); awaitingAt=Date.now(); fragment=""; latest=""; holdOpen(); }
          continue;
        }
      }else if((fragment||awaitingAt) && Date.now()-Math.max(fragmentAt,awaitingAt)<8000){
        rest=((fragment?fragment+" ":"")+a).trim();          // continuation of a command the engine cut short at a pause
      }else continue;
      lastRest=rest; latest=rest; wake.heard=rest; renderWakeStatus();
      const r=resolveCommand(rest);
      if(r.exact && !(unfinished(rest)&&!isFinal)){ fire(rest); return true; }   // a complete checklist name: go at once
      if(isFinal){ processed.add(a); fragment=rest; fragmentAt=Date.now(); holdOpen(); }   // finished but not exact: hold and join what follows
    }
    if(lastRest!==null && !isFinal){
      if(fragment||awaitingAt) holdOpen();                       // running guess of a continuation: keep the hold alive
      else if(lastRest!==pendingRest){ pendingRest=lastRest; clearTimeout(stableTimer); if(SRX()!==VoskRecognition && !unfinished(lastRest)) stableTimer=setTimeout(()=>{ if(!handled&&pendingRest) fire(pendingRest); }, 1100); }
    }
    return false;
  };
  listenOnce(alts=>{ consider(alts,true); }, err=>{
    wake.on=false; renderWakeDot(); if(err!=="ended"&&err!=="no-speech"){ wake.err=err; } renderWakeStatus();
    if(handled) return;
    if(pendingRest){ fire(pendingRest); return; }     // session ended right after the command: use what we have
    if(err==="not-allowed"||err==="service-not-allowed"||err==="unsupported"||err==="audio-capture"){ voice.wake=false; saveVoice(); render(); return; }
    clearTimeout(wake.timer); wake.timer=setTimeout(wakeLoop, err==="network"?2000:250);
  }, alts=>consider(alts,false), ()=>0);
}
function wakeStatusText(){
  if(!voice.wake) return "Off";
  if(!voice.reply) return "Needs Voice replies on";
  if(!SRX()) return "Not available in this browser";
  const st=wake.on?"Listening":(vs.active?"Paused while a checklist is being read":(vs.listening?"Paused while listening for a reply":"Restarting…"));
  return st+(wake.sessions?" · "+wake.sessions+" sessions":"")+(wake.heard?" · last heard “"+wake.heard+"”":"")+(wake.err?" · last error: "+srErrorText(wake.err)+" ("+wake.err+")":"");
}
function renderWakeStatus(){ const el=document.getElementById("wakestate"); if(el) el.textContent=wakeStatusText(); }
function renderWakeDot(){ const b=$("#brand small"); if(!b) return; const d=b.querySelector(".wakedot"); if(wake.on&&!d) b.append(h("span",{class:"wakedot",title:"Listening for “hey Aero”"})); else if(!wake.on&&d) d.remove(); }
setInterval(()=>{ if(wakeShouldRun()&&!wake.on) wakeLoop(); }, 1000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState!=="visible"){ if(wake.on){ stopListening(); wake.on=false; } } });

/* Spoken command after the wake word (or from the Say procedure button): a checklist/procedure name, "status" or "stop". */
function resolveCommand(text){
  const t=String(text).toLowerCase().replace(/\b(the|a|an|please|checklist|check list|procedure|open|go to|show|read|me)\b/g," ").replace(/\s+/g," ").trim();
  if(/\bstop\b|\bcancel\b|\bquiet\b/.test(t)) return {special:"stop",exact:true,target:null,t};
  if(/\bstatus\b/.test(t)) return {special:"status",exact:true,target:null,t};
  const a=AC(); if(!a) return {special:null,exact:false,target:null,t};
  let target=null, exact=false;
  {  // 1. a checklist or procedure whose full name was said wins outright
    const said=" "+t.replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()+" ";
    const all=["normal","emergency","abnormal"].flatMap(m=>DATA()[m].map(p=>({m,p})));
    const hit=all.filter(x=>said.includes(" "+x.p.name.toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()+" ")).sort((x,y)=>y.p.name.length-x.p.name.length)[0];
    if(hit){ target=hit; exact=true; }
  }
  const shortPhrase = !target && t.split(/\s+/).length<=3 && !/\b(fail|failure|fire|emergency|smoke|loss|unsafe|overspeed|decompression|runaway|gear|flap|flaps|manual|spin|icing|ice|door|alternator|generator|electrical|oil|fuel|vacuum|pressure|caps|parachute|single|engine)\b/.test(t);
  if(shortPhrase) for(const [re,id] of ALIASES){ if(re.test(t)){ if(id==="approach"){ target=customApproach(a.id)?{m:"normal",p:DATA().normal.find(p=>p.id===CUSTOM_ID)}:null; if(!target) continue; } else { const p=DATA().normal.find(p=>p.id===id); if(p) target={m:"normal",p}; } if(target){ exact=true; break; } } }
  if(!target){
    const all=["emergency","abnormal","normal"].flatMap(m=>DATA()[m].map(p=>({m,p})));
    const norm=x=>x.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w&&!["the","a","an","in","of","and","or","to"].includes(w));
    const words=norm(t); let best=null,bestScore=0;
    const said=" "+words.join(" ")+" ";
    const lev=(x,y)=>{ if(x===y) return 0; const m=x.length,n=y.length; if(!m||!n) return m+n; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(x[i-1]===y[j-1]?0:1)); } prev=cur; } return prev[n]; };
    const close=(w,n)=>w.length>=5&&n.length>=5&&lev(w,n)<=(w.length>=8?3:2);
    for(const x of all){
      const nameWords=norm(x.p.name); const nw=nameWords.concat(norm(x.p.cond||""));
      let sc=0; for(const w of words){ if(nw.includes(w)) sc+=2; else if(nw.some(n=>n.startsWith(w)&&w.length>3)) sc+=1; else if(nameWords.some(n=>close(w,n))) sc+=2; }
      if(nameWords.length && said.includes(" "+nameWords.join(" ")+" ")) sc+=6;
      else if(nameWords.every(n=>words.includes(n))) sc+=3;
      sc-=Math.max(0,nameWords.length-words.length)*0.5;
      if(sc>bestScore){bestScore=sc;best=x;}
    }
    if(best&&bestScore>=2) target=best;
  }
  return {special:null,exact,target,t};
}
/* Spoken command after the wake word (or from the Say procedure button): a checklist/procedure name, "status" or "stop". */
function handleSpokenCommand(text){
  const r=resolveCommand(text);
  if(r.special==="stop"){ voiceStop(); return true; }
  if(r.special==="status"){ state.mode="status"; state.sel=null; state.showing=true; save(); render(); speak("Status."); return true; }
  const target=r.target;
  if(!target){ vlogAdd("no match for “"+text+"”"); recallState.msg="Heard “"+text+"” – no matching checklist."; render(); speak("No matching checklist."); return false; }
  vlogAdd("opening "+target.p.name+" (heard “"+text+"”)");
  recallState.msg=""; state.mode=target.m; state.sel=target.p.id; state.showing=true; save(); render();
  if(!voice.read){ voice.read=true; saveVoice(); vlogAdd("read aloud turned on by voice command"); render(); }   // a spoken request to open a checklist means: read it
  voiceStart(true);
  return true;
}

/* --- tap-then-speak recall of a procedure --- */
let recallState={on:false,msg:""};
function voiceRecall(){
  if(!SRX()){ recallState.msg="Speech recognition is not available in this browser."; render(); return; }
  recallState.on=true; recallState.msg="Listening… say the procedure name"; render();
  let done=false;
  listenOnce(alts=>{
    if(done) return; done=true; recallState.on=false;
    const said=(alts[0]||"").replace(WAKE_RE,"$1");
    handleSpokenCommand(said||alts[0]||"");
  }, err=>{ if(done) return; done=true; recallState.on=false; recallState.msg=err==="not-allowed"?"Microphone not allowed.":err==="network"?"No connection for voice recognition.":"Nothing heard – tap the microphone and try again."; render(); });
}

/* --- voice bar --- */
function renderVoiceBar(){
  const old=document.getElementById("vbar"); if(old) old.remove();
  const main=$("#main");
  const c=currentRows();
  const show=voice.read && c && state.mode!=="status" && state.mode!=="charts" && state.mode!=="wb" && state.mode!=="perf" && state.mode!=="plan" && state.sel!=="__vs" && (state.showing || window.innerWidth>760);
  main.classList.toggle("voice-on",!!show);
  if(!show){ if(vs.active) voiceStop(true); return; }
  if(vs.pid!==c.p.id){ vs.pid=c.p.id; vs.active=false; vs.pending=null; vs.readNotes={}; vs.skipped={}; vs.status=""; vs.heard=""; }
  const r=vs.pending;
  const cur=r ? (r.type==="branch" ? h("div",{class:"cur"},h("b",{},r.it.branch)) : h("div",{class:"cur"},(r.type==="defer"?"Deferred: "+r.it.defer:r.it.c)+" ",h("b",{},r.type==="defer"?"NOTED":r.it.r)))
              : h("div",{class:"cur"},vs.active?"…":"Read aloud is on. Tap Start to hear this checklist.");
  const st=h("div",{class:"st"},vs.listening?h("span",{class:"lis"}):"",vs.status||(vs.active?"Reading":"Ready"));
  const btns=h("div",{class:"btns"});
  if(!vs.active){ btns.append(h("button",{onclick:()=>{ if(!vs.active) voiceStart(); }},"▶ Start")); }
  else{
    btns.append(h("button",{class:"stop",onclick:()=>voiceStop()},"■ Stop"));
    btns.append(h("button",{onclick:voiceRepeat},"Repeat"));
    if(r&&r.type!=="branch") btns.append(h("button",{onclick:voiceSkip},"Skip"));
    if(r&&r.type!=="branch") btns.append(h("button",{class:"ok",onclick:voiceConfirm},"✓ Checked"));
  }
  const bar=h("div",{class:"vbar",id:"vbar"},st,cur,btns);
  if(vs.heard) bar.append(h("div",{class:"heard"},"Heard: “"+vs.heard+"”"));
  document.body.append(bar);
}

/* ---------------- BOOT ---------------- */
function applyHash(){
  const id=(location.hash||"").replace(/^#/,"");
  if(id && byId(id) && id!==state.ac){ selectAircraft(id); return true; }
  return false;
}
function start(){
  applyTheme();
  load();
  if(!applyHash() && state.ac && !byId(state.ac)) state.ac=null;
  if(AIRCRAFT.length===1 && !state.ac) selectAircraft(AIRCRAFT[0].id);
  render();
  loadChanges().then(()=>{ showAppliedNotice(); render(); });
  if(voice.offline) offlineIsDownloaded().then(ok=>{ if(ok) offlineLoad(); else { vosk.state="off"; renderOfflineStatus(); } });
  window.addEventListener("hashchange", ()=>{ if(applyHash()){ save(); render(); } });
  document.addEventListener("pointerdown", keepAwake, {once:true});
}
start();
</script>
