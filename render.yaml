# Render blueprint: deploys the AeroE connector from the connector/ folder as a free web service.
# Open https://render.com/deploy?repo=<your fork of this repository> and Render reads this file.
services:
  - type: web
    name: aeroe-connector
    runtime: node
    rootDir: connector
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AEROE_TOKENS
        sync: false          # Render asks you for this: yourPilotId:a-long-random-secret
      - key: ALLOWED_ORIGIN
        value: https://swalksa350.github.io
      - key: OPERATOR_NAME
        value: My connector
    # For records and flight-preparation sync to survive restarts: move to the starter plan, uncomment the disk and set DATA_DIR.
    #   - key: DATA_DIR
    #     value: /data
    # disk:
    #   name: aeroe-data
    #   mountPath: /data
    #   sizeGB: 1
