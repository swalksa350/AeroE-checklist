# Builds the iOS app and uploads it to TestFlight on every push to main that touches the app.
#
# One-off setup (repository Settings › Secrets and variables › Actions › New repository secret):
#   ASC_KEY_ID      App Store Connect API key ID (10 characters)
#   ASC_ISSUER_ID   Issuer ID shown above the keys list (UUID)
#   ASC_KEY_P8      The whole contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   The 10-character Team ID (developer.apple.com › Membership details)
# Make the key at appstoreconnect.apple.com › Users and Access › Integrations › App Store Connect API › Team Keys › +,
# access "Admin" (automatic cloud signing needs it). The .p8 can be downloaded once only.
#
# Signing is automatic: Xcode creates and uses a cloud-managed Apple Distribution certificate through the API key, so
# no certificate or provisioning profile needs exporting from a Mac. The build number is the UTC minute (yyyymmddHHMM),
# the same scheme native/build-web.js stamps into the Xcode project, so manual and automatic builds sort in time order;
# the marketing version comes from changes.json.
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "changes.json"
      - "guide.html"
      - "terms.html"
      - "privacy.html"
      - "aircraft/**"
      - "wb/**"
      - "perf/**"
      - "data/**"
      - "native/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # Lane 1: GitHub's Apple-silicon Mac pool.
  build-upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-testflight
        with:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # Lane 2: only when lane 1 failed (most often "job was not acquired by a runner" when the arm64 pool is full),
  # the same build on GitHub's Intel Mac pool, which is a separate queue.
  build-upload-intel:
    needs: build-upload
    if: ${{ always() && needs.build-upload.result == 'failure' }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-testflight
        with:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
