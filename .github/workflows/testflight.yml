# Builds the iOS app and uploads it to TestFlight on every push to main that touches the app.
#
# One-off setup (repository Settings › Secrets and variables › Actions › New repository secret):
#   ASC_KEY_ID      App Store Connect API key ID (10 characters)
#   ASC_ISSUER_ID   Issuer ID shown above the keys list (UUID)
#   ASC_KEY_P8      The whole contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   The 10-character Team ID (developer.apple.com › Membership details)
# Make the key at appstoreconnect.apple.com › Users and Access › Integrations › App Store Connect API › Team Keys › +,
# access "Admin" (automatic cloud signing needs it). The .p8 can be downloaded once only.
#
# Signing is automatic: Xcode creates and uses a cloud-managed Apple Distribution certificate through the API key, so
# no certificate or provisioning profile needs exporting from a Mac. The build number is the workflow run number, so
# it always goes up; the marketing version comes from changes.json.
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "changes.json"
      - "guide.html"
      - "terms.html"
      - "privacy.html"
      - "aircraft/**"
      - "wb/**"
      - "perf/**"
      - "data/**"
      - "native/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web app into the native shell
        working-directory: native
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap sync ios

      - name: Select Xcode 26 (Apple requires the iOS 26 SDK for uploads)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this runner image. Installed:"; ls /Applications | grep -i xcode; echo "Change runs-on in this workflow to a newer macOS image."; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "Secret ASC_KEY_P8 is not set"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Version numbers
        id: ver
        run: |
          V=$(node -e 'const c=require("./changes.json"); let v=String(c[0].version); if(v.split(".").length<3) v+=".0"; console.log(v)')
          echo "marketing=$V" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Marketing version $V, build ${{ github.run_number }}"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: native/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 60

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: native/ios
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "Uploaded build ${{ steps.ver.outputs.build }} (version ${{ steps.ver.outputs.marketing }}). Apple processes it in 5–30 minutes; the Pilots group gets it automatically."
